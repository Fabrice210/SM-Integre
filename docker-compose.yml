# SM Intégré — pile complète : PostgreSQL + API Django + front (nginx).
#   cp .env.docker.example .env && docker compose up -d --build
#   → http://localhost:8080  (API : /api/v1/, documentation : /api/docs/, admin : /admin/)
# Voir docs/DEPLOIEMENT.md.

name: sm-integre

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sm_integre}
      POSTGRES_USER: ${POSTGRES_USER:-sm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: sm-integre-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sm_integre}
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-SM-2026!}
      LOAD_DEMO: ${LOAD_DEMO:-0}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # Assistant IA (API Claude) : sans clé, le front garde son moteur local.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT-medium}
      ASSISTANT_RATE: ${ASSISTANT_RATE:-30/hour}
      ASSISTANT_TIMEOUT: ${ASSISTANT_TIMEOUT:-45}
      # HTTPS : la redirection est laissée au proxy TLS placé devant (cf. docs/DEPLOIEMENT.md).
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Onboarding, e-mails (sans EMAIL_HOST : e-mails écrits dans les journaux)
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-SM Intégré <no-reply@localhost>}"
      # Pièces jointes sur S3 (ou compatible) si le bucket est défini, sinon volume `media`
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    # Disponibilité (readiness) : base jointe et migrations appliquées ; le front attend cet état.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready/', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - media:/app/media
    # Pas de port publié : l'API est jointe via le proxy nginx du front.
    expose:
      - "8000"

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: sm-integre-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONT_PORT:-8080}:8080"

volumes:
  pgdata:
  media:
