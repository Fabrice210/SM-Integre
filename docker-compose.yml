# SM Intégré — pile complète : PostgreSQL + API Django + front (nginx).
#   cp .env.docker.example .env && docker compose up -d --build
#   → http://localhost:8080  (API : /api/v1/, documentation : /api/docs/, admin : /admin/)
# Voir docs/DEPLOIEMENT.md.

name: sm-integre

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sm_integre}
      POSTGRES_USER: ${POSTGRES_USER:-sm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: sm-integre-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sm_integre}
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-SM-2026!}
      LOAD_DEMO: ${LOAD_DEMO:-0}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media:/app/media
    # Pas de port publié : l'API est jointe via le proxy nginx du front.
    expose:
      - "8000"

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: sm-integre-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONT_PORT:-8080}:8080"

volumes:
  pgdata:
  media:
