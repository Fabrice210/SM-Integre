<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM Intégré — Plateforme de digitalisation des systèmes de management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#E8EBE9; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#15201A; --ink-2:#3A4540; --muted:#6D7772; --line:#E3E7E4; --line-2:#D5DBD7;
  --green:#17693F; --green-2:#0F4F2F; --green-3:#1F8350; --green-soft:#E6F2EB; --green-tint:#F2F8F4;
  --amber:#A96A12; --amber-soft:#FCF1DE; --red:#B93A33; --red-soft:#FBE9E7; --blue:#2D5C9A; --blue-soft:#E8EFF8; --violet:#6A4E9E; --violet-soft:#EFEAF7;
  --n9001:#2D5C9A; --n14001:#3E8B2E; --n45001:#C0651A; --n27001:#6A4E9E;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,32,26,.05);
  --shadow-pop:0 18px 50px rgba(15,40,28,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green-3);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.shell{display:flex;height:calc(100vh - 24px);margin:12px;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.sidebar{width:262px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand-sub{font-size:11.5px;color:var(--muted)}
.side-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px;color:var(--muted)}
.side-search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:13px}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.nav-group{font-size:11.5px;color:var(--muted);padding:12px 8px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13.5px}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--ink);color:#fff}
.nav-item.active svg{color:#fff}
.nav-item svg{flex:none;color:var(--muted)}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 7px;color:var(--ink-2)}
.nav-item.active .count{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.nav-mod{margin-top:2px}
.nav-mod>.nav-item .chev{margin-left:auto;transition:transform .15s}
.nav-mod.open>.nav-item .chev{transform:rotate(90deg)}
.nav-sub{display:none;padding:2px 0 6px 30px;border-left:1px solid var(--line);margin-left:18px}
.nav-mod.open .nav-sub{display:block}
.nav-sub .nav-item{font-size:13px;padding:6px 10px}
.nav-sub .nav-item.active{background:var(--green-soft);color:var(--green-2);font-weight:600}
.side-card{margin-top:auto;background:var(--surface-2);border-radius:14px;padding:14px;border:1px solid var(--line)}
.side-card h4{margin:0 0 4px;font-size:14px}
.side-card p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative;flex:none}
.icon-btn.sq{border-radius:8px;width:30px;height:30px}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.crumbs{flex:1;min-width:0;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}
.topbar .spacer{display:none}
@media (min-width:901px){.topbar{flex-wrap:nowrap}}
@media (max-width:1560px){.user-chip .who{display:none}}
@media (max-width:1500px){.cal{grid-template-columns:repeat(6,minmax(0,1fr))}}
.norm-switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.norm-switch button{border:0;background:transparent;padding:5px 9px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.norm-switch button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink);font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green-soft);color:var(--green-2);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:transparent;padding:0}
.user-chip .who{font-size:12px;line-height:1.2;text-align:left}
.user-chip .who small{color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:22px 24px 40px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--red);border-color:#EDC6C2}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Page ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:22px;letter-spacing:-.015em}
.page-head p{margin:3px 0 0;color:var(--muted);max-width:75ch}
.page-kicker{font-size:12.5px;color:var(--green);font-weight:600;margin-bottom:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:1.15fr 1fr 1fr 1fr}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.span2{grid-column:span 2}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.card.flat{background:var(--surface-2)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
.card-h .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.mb{margin-bottom:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt0{margin-top:0}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* stat cards */
.stat{position:relative;display:flex;flex-direction:column;gap:10px;min-height:150px}
.stat-top{display:flex;gap:11px;align-items:flex-start}
.stat-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.stat h4{margin:0;font-size:14.5px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;padding-left:0;padding-right:0}
.stat.hero{background:var(--green);color:#fff;border-color:var(--green);overflow:hidden}
.stat.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:240px;height:240px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 26px,transparent 26px 52px);transform:skewX(-8deg);pointer-events:none}
.stat.hero .lbl{color:rgba(255,255,255,.75)}
.stat.hero .stat-ic{background:#fff;border-color:#fff;color:var(--green)}
.stat.hero .foot{border-top-color:rgba(255,255,255,.2);color:#fff}
.chip-up{font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;background:var(--green-soft);color:var(--green-2);border:1px solid #CFE6D8}
.stat.hero .chip-up{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-soft);color:var(--green-2)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-grey{background:#EEF0EF;color:#56605B}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.norm{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin:1px 2px 1px 0;color:#fff;letter-spacing:.01em}
.n9001{background:var(--n9001)}.n14001{background:var(--n14001)}.n45001{background:var(--n45001)}.n27001{background:var(--n27001)}

/* tables */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;min-width:200px;background:#fff}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:13px}
.sel{border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;background:#fff;font-size:13px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--green-tint)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .ttl{font-weight:600}
.tbl .ref{color:var(--muted);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.count-line{font-size:12px;color:var(--muted);margin-top:8px}

/* progress */
.prog{height:7px;background:#E9EDEA;border-radius:6px;overflow:hidden;min-width:70px}
.prog>i{display:block;height:100%;background:var(--green);border-radius:6px}
.prog.warn>i{background:#D08B1E}.prog.bad>i{background:var(--red)}
.prog-line{display:flex;align-items:center;gap:8px}
.prog-line span{font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:20px;padding:2px}
.seg button{border:0;background:transparent;border-radius:18px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field label .req{color:var(--red)}
.field .hint{font-size:11.5px;color:var(--muted)}
.inp{border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;background:#fff;width:100%;font-size:13.5px}
textarea.inp{min-height:78px;resize:vertical}
.inp:focus{border-color:var(--green-3);outline:0;box-shadow:0 0 0 3px rgba(31,131,80,.12)}
.field.err .inp{border-color:var(--red)}
.field .errmsg{font-size:11.5px;color:var(--red);display:none}
.field.err .errmsg{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:20px;padding:4px 10px;font-size:12.5px;cursor:pointer;user-select:none;background:#fff}
.chipbox input{accent-color:var(--green);margin:0}
.chipbox.on{background:var(--green-soft);border-color:#BFDDCB;color:var(--green-2)}
.scale{display:flex;gap:6px}
.scale label{flex:1}
.scale input{display:none}
.scale span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:8px;padding:6px 0;cursor:pointer;font-weight:600;font-size:13px}
.scale input:checked+span{background:var(--green);color:#fff;border-color:var(--green)}
.file-drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;background:var(--surface-2)}
.file-drop .fname{font-weight:600;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{appearance:none;width:36px;height:20px;background:#CBD3CE;border-radius:20px;position:relative;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.toggle input:checked{background:var(--green)}
.toggle input:checked::after{left:18px}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(18,30,24,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;width:min(760px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-pop)}
.modal.wide{width:min(1040px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-h h3{margin:0;font-size:17px}
.modal-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.drawer-ov{justify-content:flex-end;padding:0}
.drawer{background:#fff;width:min(620px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
.dsec{margin-top:18px}
.dsec h4{margin:0 0 8px;font-size:13.5px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 18px;font-size:12.5px}
.timeline li::before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.timeline li::after{content:"";position:absolute;left:6px;top:15px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .when{color:var(--muted)}
.linklist{display:flex;flex-direction:column;gap:6px}
.linkitem{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;background:#fff;cursor:pointer;text-align:left;width:100%}
.linkitem:hover{background:var(--green-tint)}

/* workflow */
.wf{display:flex;align-items:center;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.wf-step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.wf-step .c{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700;background:#fff}
.wf-step.done{color:var(--green-2)}
.wf-step.done .c{background:var(--green);border-color:var(--green);color:#fff}
.wf-step.cur{color:var(--ink);font-weight:600}
.wf-step.cur .c{border-color:var(--green);color:var(--green)}
.wf-step.ko .c{border-color:var(--red);color:var(--red)}
.wf-bar{width:34px;height:1.5px;background:var(--line-2);margin:0 8px}
.wf-bar.done{background:var(--green)}

/* toast */
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:#fff;border-radius:11px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow-pop);max-width:380px;animation:fade .2s}
.toast.ok{background:var(--green-2)}
.toast.warn{background:#7A4F10}

/* chart */
.bars{display:flex;align-items:flex-end;gap:14px;height:210px;padding:0 4px 0 40px;position:relative}
.bars .yax{position:absolute;left:0;top:0;bottom:22px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted)}
.bars .gl{position:absolute;left:36px;right:0;border-top:1px dashed var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;position:relative;cursor:pointer}
.bar i{display:block;width:100%;max-width:62px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,#CFE3D7,#EEF5F0);transition:background .15s}
.bar.on i,.bar:hover i{background:linear-gradient(180deg,var(--green),#2E8A58 60%,#DCEDE3)}
.bar span{font-size:11.5px;color:var(--muted)}
.bar .tip{position:absolute;bottom:calc(100% - 8px);left:50%;transform:translate(-10%,0);background:var(--ink);color:#fff;border-radius:9px;padding:8px 10px;font-size:11.5px;white-space:nowrap;display:none;z-index:3;line-height:1.5}
.bar.on .tip{display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* heatmap */
.heat{display:grid;grid-template-columns:36px repeat(4,1fr);gap:5px;font-size:12px}
.heat .cell{border-radius:8px;min-height:62px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.heat .ax{display:grid;place-items:center;color:var(--muted);font-weight:600}
.hm-1{background:#E4F1E8}.hm-2{background:#F6EDC8}.hm-3{background:#F8D9B6}.hm-4{background:#F2BDB6}
.pin{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 5px;background:#fff;border:1px solid rgba(0,0,0,.1);cursor:pointer}
.pin.opp{background:var(--green);color:#fff;border-color:var(--green)}

/* process map */
.pmap{display:flex;flex-direction:column;gap:12px}
.pband{border-radius:14px;padding:12px;border:1px solid var(--line)}
.pband h5{margin:0 0 8px;font-size:12.5px;color:var(--ink-2)}
.pband.pil{background:#EEF3FA}.pband.rea{background:var(--green-tint)}.pband.sup{background:#F8F4EC}
.pflow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}

const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function fd(s){ if(!s||s==='—') return '—'; const d=new Date(s); if(isNaN(d)) return esc(s); return d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear(); }
function days(s){ if(!s||s==='—') return null; const d=new Date(s); if(isNaN(d)) return null; return Math.round((d-TODAY)/86400000); }
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(n){ const d=new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); }
function nowStamp(){ const d=new Date(); return iso(TODAY)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function money(n){ return Number(n||0).toLocaleString('fr-FR')+' FCFA'; }
function initials(n){ return String(n).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }

  user:USERS[0], activeNorms:[...ALL_N], onb:{step:0}, onboarded:false, history:[], hist_i:-1, sidebar:false, auditorAccess:true, erpModule:false
};
const activeN = () => S.activeNorms;
function inNorm(r){ if(S.norm==='all'||S.norm==='cross') return true; if(!r||!r.normes) return true; return r.normes.includes(S.norm); }
function nb(arr){ return (arr||[]).filter(n=>activeN().includes(n)).map(n=>`<span class="norm n${n}" title="${NORMS[n].code} — ${NORMS[n].nom}">${n}</span>`).join('') || '<span class="muted small">—</span>'; }

/* ===================== Statuts ===================== */
const ST_COL = {
  green:['Fait','Clôturé','Clôturée','Conforme','Diffusé','Approuvé','Validée','Validé','Réalisé','Réalisée','Publiée','Efficace','Lu','Mise à disposition','En vigueur','Actif','Inclus','Couvert','Terminé','Point fort','Approuvée RSM','Disponible'],
  amber:['En cours','Mise en œuvre','Soumise','Vérification','Approbation','Planifié','Planifiée','Plan diffusé','Rapport déposé','À traiter','En attente','En traitement','Validée pilote','Préparée','Partiellement efficace','À évaluer','Observation','NC mineure','Brouillon','Rédaction','En cours d\'évaluation','Non évaluée','Moyen'],
  red:['Pas fait','Refusée','Refusé','En retard','Non conforme','Non lu','NC majeure','Exclu','Critique','Obsolète','Déclarée','Élevé','Très élevé'],
  blue:['Classique','Planifiée ','Positif','Faible']
};
function sb(s){ if(s==null||s==='') return '<span class="badge b-grey">—</span>'; let c='b-grey'; for(const [k,v] of Object.entries(ST_COL)) if(v.includes(s)) {c='b-'+k;break;} if(s==='Négatif') c='b-red'; if(s==='Obsolète') c='b-grey'; return `<span class="badge dot ${c}">${esc(s)}</span>`; }
function prog(p,warnBelow=60,badBelow=35){ p=Math.max(0,Math.min(100,Math.round(p))); const c=p<badBelow?'bad':p<warnBelow?'warn':''; return `<div class="prog-line"><div class="prog ${c}" style="flex:1"><i style="width:${p}%"></i></div><span>${p} %</span></div>`; }
function dueBadge(s, done){ if(done) return fd(s); const d=days(s); if(d===null) return fd(s); if(d<0) return `${fd(s)} <span class="badge b-red">en retard de ${-d} j</span>`; if(d<=30) return `${fd(s)} <span class="badge b-amber">J-${d}</span>`; return fd(s); }

/* ===================== Journal / historique ===================== */
function logAct(a,mod,statut='Terminé'){ DB.journal.unshift({d:nowStamp(),u:S.user.nom,a,mod,statut}); }
function hist(r,a){ r.hist=r.hist||[]; r.hist.unshift({d:nowStamp(),u:S.user.nom,a}); }

/* ===================== Toast ===================== */
function toast(msg,type='ok'){ let t=$('#toasts'); if(!t){t=document.createElement('div');t.id='toasts';t.className='toasts';document.body.appendChild(t);} const e=document.createElement('div'); e.className='toast '+type; e.textContent=msg; t.appendChild(e); while(t.children.length>3) t.firstChild.remove(); setTimeout(()=>e.remove(),3800); }

/* ===================== Modal / Drawer ===================== */
function modal({title,sub='',body,foot='',wide=false,id='modal'}){
  closeModal(id);
  const o=document.createElement('div'); o.className='overlay'; o.id=id;
  o.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn sq" onclick="closeModal('${id}')" aria-label="Fermer">${I(IC.x,16)}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  o.addEventListener('mousedown',e=>{ if(e.target===o) closeModal(id); });
  document.body.appendChild(o);
  const f=o.querySelector('input,select,textarea,button.btn'); if(f) setTimeout(()=>f.focus(),30);
  return o;
}
function closeModal(id='modal'){ const e=document.getElementById(id); if(e) e.remove(); }
function drawer({title,sub='',body,foot=''}){
  closeModal('drawer');
  const o=document.createElement('div'); o.className='overlay drawer-ov'; o.id='drawer';
  o.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn sq" onclick="closeModal('drawer')" aria-label="Fermer">${I(IC.x,16)}</button></div><div class="modal-b" style="flex:1">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</aside>`;
  o.addEventListener('mousedown',e=>{ if(e.target===o) closeModal('drawer'); });
  document.body.appendChild(o);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#modal')) closeModal('modal'); else if($('#modal2')) closeModal('modal2'); else if($('#drawer')) closeModal('drawer'); else if(S.notif){S.notif=false;render();} } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); const s=$('#sideSearch'); if(s) s.focus(); } });

/* ===================== Formulaires génériques ===================== */
function optList(o){ return (typeof o==='function'?o():o)||[]; }
function fieldHTML(f,val){
  const id='f_'+f.k, req=f.req?'<span class="req"> *</span>':'';
  const full=(f.t==='textarea'||f.full||f.t==='multi'||f.t==='norms'||f.t==='file')?' full':'';
  let inp='';
  const v = (Array.isArray(val)&&f.t==='textarea')? val.join('\n') : (val ?? '');
  switch(f.t){
    case 'textarea': inp=`<textarea class="inp" id="${id}" name="${f.k}">${esc(v)}</textarea>`; break;
    case 'select': inp=`<select class="inp" id="${id}" name="${f.k}">${optList(f.o).map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`}).join('')}</select>`; break;
    case 'multi': case 'norms': {
      const opts = f.t==='norms'? activeN().map(n=>[n,NORMS[n].code]) : optList(f.o);
      const arr = Array.isArray(v)?v:[];
      inp=`<div class="chips" data-multi="${f.k}">${opts.map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];const on=arr.includes(a);return `<label class="chipbox ${on?'on':''}"><input type="checkbox" value="${esc(a)}" ${on?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(b)}</label>`}).join('')}</div>`; break; }
    case 'scale': { const n=f.max||5; inp=`<div class="scale" data-scale="${f.k}">${Array.from({length:n},(_,i)=>`<label><input type="radio" name="${f.k}" value="${i+1}" ${Number(v)===i+1?'checked':''}><span>${i+1}</span></label>`).join('')}</div>`; break; }
    case 'file': inp=`<div class="file-drop">${I(IC.up,22)}<div style="flex:1;min-width:0"><input class="inp" id="${id}" name="${f.k}" value="${esc(v)}" aria-label="Nom du fichier joint"><div class="hint" style="margin-top:4px">Glissez un fichier ou choisissez-le (PDF, Word, Excel, image — 50 Mo max)</div></div><label class="btn sm">Parcourir<input type="file" hidden onchange="if(this.files[0]) document.getElementById('${id}').value=this.files[0].name"></label></div>`; break;
    case 'toggle': inp=`<label class="toggle"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}><span class="small">${esc(f.lbl||'Oui')}</span></label>`; break;
    default: inp=`<input class="inp" id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.t==='number'?'step="any"':''}>`;
  }
  return `<div class="field${full}" data-f="${f.k}"><label for="${id}">${esc(f.l)}${req}</label>${inp}${f.h?`<span class="hint">${esc(f.h)}</span>`:''}<span class="errmsg">${esc(f.err||'Ce champ est obligatoire.')}</span></div>`;
}
function formHTML(fields,rec){ return `<div class="form-grid">${fields.map(f=>fieldHTML(f,rec[f.k])).join('')}</div>`; }
function readForm(root,fields){
  const out={}; let ok=true;
  fields.forEach(f=>{
    const box=root.querySelector(`[data-f="${f.k}"]`); let v;
    if(f.t==='multi'||f.t==='norms') v=[...box.querySelectorAll('input:checked')].map(i=>i.value);
    else if(f.t==='scale'){ const c=box.querySelector('input:checked'); v=c?Number(c.value):null; }
    else if(f.t==='toggle') v=box.querySelector('input').checked;
    else { v=box.querySelector('.inp').value.trim(); if(f.t==='number') v=v===''?'':Number(v); }
    const empty = v===''||v==null||(Array.isArray(v)&&!v.length);
    const bad = (f.req && empty) || (f.check && !empty && !f.check(v,out));
    box.classList.toggle('err',!!bad); if(bad) ok=false;
    out[f.k]=v;
  });
  return ok?out:null;
}

/* Formulaire CRUD générique : FORMS[coll] = {title, fields, def(), save(rec,isNew)} */
const FORMS = {};
function openForm(coll,id){
  const F=FORMS[coll]; const cur = id? findRec(coll,id) : null;
  const rec = cur? {...cur} : F.def();
  const fields = typeof F.fields==='function'? F.fields(rec,!cur) : F.fields;
  modal({title:(cur?'Modifier — ':'Nouveau — ')+F.title, sub: cur? 'Les modifications sont historisées dans le journal.' : (F.sub||'Formulaire prérempli avec un exemple : adaptez les valeurs puis enregistrez.'), wide:F.wide, body:formHTML(fields,rec),
    foot:`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="saveBtn">${I(IC.check,16)} ${cur?'Enregistrer les modifications':'Enregistrer'}</button>`});
  $('#saveBtn').onclick=()=>{
    const data=readForm($('#modal'),fields); if(!data){ toast('Complétez les champs signalés en rouge.','warn'); return; }
    let r;
    if(cur){ Object.assign(cur,data); r=cur; hist(r,'Modification'); }
    else { r={id:uid(F.prefix||'X'),...rec,...data}; hist(r,'Création'); (F.list?F.list():DB[coll]).unshift(r); }
    const res = F.save? F.save(r,!cur) : null;
    logAct(`a ${cur?'modifié':'créé'} « ${r[F.label||'intitule']||r.nom||r.libelle||r.id} » (${F.title})`, F.mod||F.title);
    closeModal(); if($('#drawer')) closeModal('drawer');
    toast(res||(cur?'Modifications enregistrées.':F.title+' enregistré(e).')); render();
  };
}
function findRec(coll,id){ const F=FORMS[coll]; const list=F&&F.list?F.list():DB[coll]; return (list||[]).find(x=>x.id===id); }
function delRec(coll,id){
  const F=FORMS[coll]; const list=F&&F.list?F.list():DB[coll]; const r=list.find(x=>x.id===id); if(!r) return;
  modal({id:'modal2',title:'Supprimer cet élément ?',body:`<p>« ${esc(r[F?.label||'intitule']||r.nom||r.libelle||r.id)} » sera retiré de la liste. L'action est tracée dans le journal d'audit.</p>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn danger" onclick="doDel('${coll}','${id}')">${I(IC.trash,15)} Supprimer</button>`});
}
function doDel(coll,id){ const F=FORMS[coll]; const list=F&&F.list?F.list():DB[coll]; const i=list.findIndex(x=>x.id===id); const r=list[i]; list.splice(i,1); logAct(`a supprimé « ${r[F?.label||'intitule']||r.nom||r.id} »`,F?.mod||coll); closeModal('modal2'); closeModal('drawer'); toast('Élément supprimé.'); render(); }
function markObsolete(coll,id){ const r=findRec(coll,id); r.statut='Obsolète'; r.obsolete=true; hist(r,'Classé obsolète (traçabilité conservée)'); logAct(`a classé obsolète « ${r.intitule||r.titre||r.id} »`,coll); closeModal('drawer'); toast('Élément classé obsolète — il reste consultable dans l\'historique.'); render(); }

/* ===================== Tableau générique ===================== */
function table({id,cols,rows,click,search=[],filters=[],add,addLabel='Ajouter',exportName,extra='',norm=true,empty='Aucun élément ne correspond à ces critères. Modifiez les filtres ou ajoutez un élément.'}){
  let data = norm? rows.filter(inNorm) : rows.slice();
  const q=(S.search[id]||'').toLowerCase();
  if(q) data=data.filter(r=>search.some(k=>String(typeof k==='function'?k(r):r[k]??'').toLowerCase().includes(q)));
  const fv=S.filt[id]||{};
  filters.forEach(f=>{ const v=fv[f.k]; if(v) data=data.filter(r=> f.fn? f.fn(r,v) : (Array.isArray(r[f.k])? r[f.k].includes(v) : String(r[f.k])===v)); });
  window._tbl=window._tbl||{}; window._tbl[id]={cols,data,exportName};
  const tb = `<div class="toolbar">
    ${search.length?`<div class="search">${I(IC.search,15)}<input placeholder="Rechercher…" value="${esc(S.search[id]||'')}" oninput="S.search['${id}']=this.value;rerenderKeep(this)" data-sid="${id}" aria-label="Rechercher"></div>`:''}
    ${filters.map(f=>`<select class="sel" aria-label="${esc(f.l)}" onchange="(S.filt['${id}']=S.filt['${id}']||{})['${f.k}']=this.value;render()"><option value="">${esc(f.l)} : tous</option>${optList(f.o).map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}" ${fv[f.k]===a?'selected':''}>${esc(b)}</option>`}).join('')}</select>`).join('')}
    <span class="spacer" style="flex:1"></span>${extra}
    ${exportName?`<button class="btn sm" onclick="exportTable('${id}','xls')">${I(IC.dl,14)} Excel</button><button class="btn sm" onclick="exportTable('${id}','pdf')">${I(IC.doc,14)} PDF</button>`:''}
    ${add?`<button class="btn primary sm" onclick="${add}">${I(IC.plus,14)} ${esc(addLabel)}</button>`:''}</div>`;
  const body = data.length? data.map(r=>`<tr class="${click?'click':''}" ${click?`onclick="${click}('${r.id}')"`:''}>${cols.map(c=>`<td class="${c.cls||''}">${c.r?c.r(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}"><div class="empty">${empty}</div></td></tr>`;
  return tb+`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div><div class="count-line">${data.length} élément(s) affiché(s)${S.norm!=='all'&&S.norm!=='cross'&&norm?' — filtre '+NORMS[S.norm].code+' actif':''}</div>`;
}
function rerenderKeep(inp){ const sid=inp.dataset.sid, pos=inp.selectionStart; render(); const n=document.querySelector(`[data-sid="${sid}"]`); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }
const txt = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); };

/* ===================== Exports ===================== */
function download(name,content,type){ const b=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function exportTable(id,fmt){
  const t=window._tbl[id]; if(!t) return; const cols=t.cols.filter(c=>c.l);
  if(fmt==='xls'){
    const csv='\ufeff'+[cols.map(c=>c.l).join(';'), ...t.data.map(r=>cols.map(c=>'"'+(c.r?txt(c.r(r)):String(r[c.k]??'')).replace(/"/g,'""')+'"').join(';'))].join('\r\n');
    download((t.exportName||id)+'.csv',csv,'text/csv;charset=utf-8'); logAct(`a exporté « ${t.exportName} » (Excel)`,'Export'); toast('Export Excel généré (fichier CSV compatible Excel).');
  } else {
    const html=`<table><thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${t.data.map(r=>`<tr>${cols.map(c=>`<td>${esc(c.r?txt(c.r(r)):r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    printDoc(t.exportName||id,html);
  }
}
function printDoc(title,html){
  const w=window.open('','_blank'); if(!w){ toast('Autorisez les fenêtres surgissantes pour générer le PDF.','warn'); return; }
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#15201A;margin:28px}h1{font-size:18px;margin:0}h2{font-size:14px;margin:18px 0 6px}.meta{color:#6D7772;margin:4px 0 16px}table{width:100%;border-collapse:collapse;margin-top:6px}th,td{border:1px solid #D5DBD7;padding:6px 8px;text-align:left;vertical-align:top}th{background:#E6F2EB}.hd{display:flex;justify-content:space-between;border-bottom:2px solid #17693F;padding-bottom:10px;margin-bottom:12px}</style></head><body><div class="hd"><div><h1>${esc(title)}</h1><div class="meta">${esc(ORG.nom)} — généré le ${fd(iso(TODAY))} par ${esc(S.user.nom)}</div></div><div class="meta">Système de Management intégré<br>${activeN().map(n=>NORMS[n].code).join(' · ')}</div></div>${html}<script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close(); logAct(`a généré le PDF « ${title} »`,'Export');
}
function exportWord(title,html){ download(title.replace(/\s+/g,'_')+'.doc',`<html><head><meta charset="utf-8"><title>${esc(title)}</title></head><body style="font-family:Arial">${html}</body></html>`,'application/msword'); logAct(`a exporté « ${title} » (Word)`,'Export'); toast('Document Word généré.'); }

function wfHTML(steps,curIdx,ko){ return `<div class="wf">${steps.map((s,i)=>`${i?`<div class="wf-bar ${i<=curIdx?'done':''}"></div>`:''}<div class="wf-step ${i<curIdx?'done':i===curIdx?(ko?'ko':'cur'):''}"><span class="c">${i<curIdx?'✓':i+1}</span>${esc(s)}</div>`).join('')}</div>`; }

/* ===================== Alertes (surveillance des échéances) ===================== */
function computeAlerts(){
  const A=[];
  const push=(lvl,t,d,go,resp,key)=>A.push({lvl,t,d,go,resp,key:key||t});
  DB.objectifs.forEach(o=>o.actions.forEach(a=>{ const d=days(a.echeance); if(a.statut!=='Clôturé'&&d!==null&&d<0) push('red',`Action en retard — ${o.code}`,`${a.libelle} (${a.responsable}) — échéance ${fd(a.echeance)}`,"go('m3-objectifs')",a.responsable); }));
  DB.risques.forEach(r=>{ const d=days(r.echeance); if(r.statutAction!=='Clôturé'&&d!==null&&d<0) push('red',`Traitement du risque ${r.id} en retard`,`${r.action} — ${r.responsable}`,"go('m3-risques')",r.responsable); });
  [...DB.representants.map(x=>({...x,q:'Représentant'})),...DB.comite.map(x=>({...x,q:'Comité HS'}))].forEach(m=>{ const d=days(m.mandatFin); if(d!==null&&d>=0&&d<=60) push('amber',`Mandat arrivant à échéance (${m.q})`,`${m.prenom} ${m.nom} — fin le ${fd(m.mandatFin)} (J-${d})`,"go('m2-consultation')",'Gildas HOUNKPATIN'); });
  DB.textes.forEach(t=>{ const d=days(t.echeance); if(t.statut==='Pas fait'&&d!==null&&d<=15) push(d<0?'red':'amber',`Texte réglementaire non conforme`,`${t.intitule.slice(0,70)}… — ${d<0?'délai dépassé':'J-'+d}`,"go('m3-veille')",t.responsable); });
  DB.declarations.filter(x=>x.statut==='Soumise').forEach(x=>push('blue','Déclaration en attente de validation du DG',x.objet,"go('m3-veille')",'Rodrigue AHOUANSOU'));
  DB.ressources.forEach(r=>{ const d=days(r.dateDemandee); if(r.statut!=='Mise à disposition'&&d!==null&&d<0) push('red','Retard de mise à disposition',`${r.besoin} — demandée pour le ${fd(r.dateDemandee)}`,"go('m4-ressources')",r.demandeur); });
  DB.documents.forEach(x=>{ const d=days(x.dateRevue); if(x.statut!=='Obsolète'&&d!==null&&d<=30) push(d<0?'red':'amber','Revue documentaire proche',`${x.ref} ${x.intitule} — ${fd(x.dateRevue)}`,"go('m5-ged')",x.proprietaire); });
  DB.urgences.forEach(u=>u.exercices.forEach(e=>{ if(e.statut==='En retard'||(e.statut==='Planifié'&&days(e.date)<0)) push('red','Exercice d\'urgence non réalisé',`${u.type} — prévu le ${fd(e.date)}`,"go('m5-urgences')",u.responsables.split(' (')[0]); }));
  DB.fichesMaitrise.forEach(f=>{ const d=days(f.prochaineMaj); if(d!==null&&d<=30) push(d<0?'red':'amber','Mise à jour de fiche de maîtrise',`${f.objet} — ${d<0?'échue depuis '+(-d)+' j':'J-'+d}`,"go('m5-fiches')",f.responsable); });
  DB.indicateurs.forEach(k=>{ const t=taux(k); if(t<80) push('amber','Écart significatif sur un indicateur',`${k.kpi} : ${k.valeur}${k.unite} pour une cible de ${k.cible}${k.unite} (taux ${t} %)`,"go('m6-surveillance')",k.responsable); });
  DB.audits.forEach(a=>{ const d=days(a.date); if(a.statut!=='Clôturé'&&d!==null&&d>=0&&d<=60) push('blue','Audit à venir — auditeur alerté',`${a.ref} ${a.titre} — ${fd(a.date)} (${a.auditeur})`,"go('m6-audits')",a.auditeur); });
  competenceGaps().filter(g=>g.critique).slice(0,2).forEach(g=>push('amber','Compétence critique non couverte',`${g.comp} — ${g.nb} collaborateur(s) sous le niveau requis`,"go('m4-competences')",'Gildas HOUNKPATIN'));
  DB.ncs.filter(n=>n.statut==='Déclarée').forEach(n=>push('blue','Non-conformité à valider',`${n.ref} — ${n.description}`,"go('m6-nc')",procOwner(n.processus)));
  return A.filter(a=>!(S.dismissed||[]).includes(a.key));
}
function procOwner(pid){ const p=DB.processus.find(x=>x.id===pid); return p?p.proprietaire:'Florence DOSSOU-YOVO'; }
function taux(k){ if(!k.valeur&&k.valeur!==0) return 0; const t = k.sens==='baisse'? (k.valeur<=k.cible?100: k.cible/k.valeur*100) : k.valeur/k.cible*100; return Math.min(100,Math.round(t)); }
function competenceGaps(){ const C=DB.competences; return C.liste.map((c,i)=>{ const nb=C.collaborateurs.filter(p=>p.niveaux[i]>0&&p.niveaux[i]<C.requis[c]).length; const zero=C.collaborateurs.filter(p=>p.niveaux[i]>=C.requis[c]).length; return {comp:c,nb,couverts:zero,critique:zero<2}; }); }

function upcoming(){ const L=[]; const add=(t,d,m,r)=>{ const x=days(d); if(x!==null&&x>=0&&x<=30) L.push({t,d,m,r}); };
  DB.objectifs.forEach(o=>o.actions.forEach(a=>a.statut!=='Clôturé'&&add(a.libelle,a.echeance,'Plan d\'action '+o.code,a.responsable)));
  DB.audits.forEach(a=>add(a.titre,a.date,'Audit '+a.ref,a.auditeur)); DB.textes.forEach(t=>add('Évaluation : '+t.intitule.slice(0,50)+'…',t.echeance,'Veille réglementaire',t.responsable));
  DB.urgences.forEach(u=>u.exercices.forEach(e=>add('Exercice : '+u.type,e.date,'Situations d\'urgence',u.responsables.split(' (')[0])));
  DB.plansOps.forEach(p=>p.statut!=='Fait'&&add(p.plan,p.echeance,'Planification opérationnelle',p.responsable)); DB.formations.forEach(f=>f.statut==='Planifiée'&&add('Formation : '+f.theme,f.date,'Compétences',f.formateur));
  DB.fichesMaitrise.forEach(f=>add('Mise à jour : '+f.objet,f.prochaineMaj,'Fiche de maîtrise',f.responsable)); DB.documents.forEach(d=>d.statut!=='Obsolète'&&add('Revue '+d.ref,d.dateRevue,'GED',d.proprietaire));
  return L.sort((a,b)=>new Date(a.d)-new Date(b.d)); }
function crossView(){ const mods=[...new Set(DB.mapping.map(m=>m.module))];
  return `<div class="card mb"><div class="card-h"><div><h3>Vue croisée — exigences communes et spécifiques</h3><div class="sub">Structure harmonisée ISO : une même fonction du noyau couvre plusieurs normes</div></div><div class="legend"><span><i style="background:var(--green)"></i>Commune</span><span><i style="background:var(--amber)"></i>Spécifique</span></div></div><div class="tbl-wrap"><table class="tbl mx"><thead><tr><th>Fonction du noyau</th>${activeN().map(n=>`<th>${NORMS[n].code}</th>`).join('')}</tr></thead><tbody>${mods.map(md=>`<tr><td class="ttl">${esc(md)}</td>${activeN().map(n=>{const L=DB.mapping.filter(m=>m.module===md&&m.norme===n);return `<td>${L.map(m=>`<span class="badge ${m.type==='Commune'?'b-green':'b-amber'}" title="${esc(m.libelle)}">§${m.article}</span>`).join(' ')||'<span class="muted">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`; }

function openAI(){ S.ai=true; if(!S.aiMsgs.length) S.aiMsgs=[{b:1,t:'Bonjour, je réponds à partir des procédures, preuves et enregistrements de votre organisme uniquement. Mes propositions doivent être validées par un humain avant toute application.'}]; render(); setTimeout(()=>{const i=$('#aiIn'); if(i) i.focus();},30); }
function aiPanel(){ const k=S.page.split('-')[0]; const sug=AI_CTX[k]||AI_CTX[S.page]||AI_CTX.other;
  return `<aside class="ai-panel" role="dialog" aria-label="Assistant IA"><div class="ai-h"><div><b>${I(IC.ai,16)} Assistant IA</b><div class="small muted">Contexte : ${esc(PAGES[S.page].t)}</div></div><button class="icon-btn sq" onclick="S.ai=false;render()" aria-label="Fermer">${I(IC.x,15)}</button></div>
  <div class="ai-b" id="aiBody">${S.aiMsgs.map(m=>`<div class="msg ${m.b?'bot':'me'}">${esc(m.t)}</div>`).join('')}<div class="ai-sugg">${sug.map(s=>`<button onclick="aiAsk(this.textContent)">${esc(s)}</button>`).join('')}</div></div>
  <div class="ai-f"><input class="inp" id="aiIn" value="Quelles actions sont en retard ?" onkeydown="if(event.key==='Enter')aiAsk(this.value)" aria-label="Votre question"><button class="btn primary" onclick="aiAsk($('#aiIn').value)" aria-label="Envoyer">${I(IC.send,15)}</button></div><div class="ai-note">Démonstration : réponses calculées à partir des données de la plateforme. Isolation stricte par organisme.</div></aside>`; }
function aiAsk(q){ q=(q||'').trim(); if(!q) return; S.aiMsgs.push({b:0,t:q}); S.aiMsgs.push({b:1,t:aiAnswer(q.toLowerCase())}); render(); const b=$('#aiBody'); if(b) b.scrollTop=b.scrollHeight; }
function aiAnswer(q){
  if(q.includes('retard')&&q.includes('exercice')) { const L=[]; DB.urgences.forEach(u=>u.exercices.filter(e=>e.statut==='En retard').forEach(e=>L.push(`• ${u.type} — prévu le ${fd(e.date)}`))); return 'Exercices non réalisés dans les délais :\n'+L.join('\n'); }
  if(q.includes('retard')){ const L=openActions().filter(a=>days(a.echeance)<0); return `${L.length} action(s) en retard :\n`+L.map(a=>`• ${a.libelle} — ${a.responsable} (échéance ${fd(a.echeance)})`).join('\n')+'\n\nJe peux préparer une relance groupée ; elle sera envoyée après votre confirmation.'; }
  if(q.includes('formation')&&(q.includes('it')||q.includes('sécurité'))) { const f=DB.formations.find(x=>x.id==='FO2'); return `Dernière preuve : « ${f.theme} » réalisée le ${fd(f.date)} par ${f.formateur} pour ${f.participants}. Évaluation du ${fd(f.evaluationDate)} : ${f.resultat}.`; }
  if(q.includes('audit')&&(q.includes('résume')||q.includes('3'))) return 'Synthèse des 3 derniers audits :\n'+DB.audits.filter(a=>a.constats.length).slice(-3).map(a=>`• ${a.ref} (${fd(a.date)}) — ${a.constats.map(c=>c.type+' : '+c.description).join(' ; ')}`).join('\n')+'\n\nTendance : la maîtrise des équipements et des sauvegardes revient dans 2 audits sur 3.';
  if(q.includes('pv')||q.includes('revue')) return 'Projet de PV (à valider) :\n1. Couverture normative globale : '+coverage('all')+' %.\n2. '+DB.ncs.filter(n=>n.statut!=='Clôturée').length+' NC ouvertes, dont 1 majeure (carters).\n3. Conformité réglementaire : 2 textes non conformes (Code du numérique, déchets).\n4. Indicateurs sous la cible : TF1 (11,2 pour 8), valorisation des coques (60 % pour 85 %).\nDécisions proposées : prioriser le test de restauration ERP et la déclaration APDP.';
  if(q.includes('risque')) return 'Risques SST suggérés pour le processus Maintenance (par comparaison sectorielle) :\n• Électrisation lors d\'interventions sur armoires non consignées\n• Chute de hauteur lors de l\'entretien des silos\n• Exposition au bruit des décortiqueuses (> 85 dB)\nAucun risque n\'est créé sans votre validation.';
  if(q.includes('texte')||q.includes('réglementaire')||q.includes('conformité')) { const L=DB.textes.filter(t=>t.statut!=='Fait'); return `${L.length} texte(s) non conforme(s) :\n`+L.map(t=>`• ${t.intitule} — ${t.justificatif}`).join('\n'); }
  if(q.includes('compétence')) return 'Compétences critiques insuffisamment couvertes :\n'+competenceGaps().filter(g=>g.critique).map(g=>`• ${g.comp} : ${g.couverts} collaborateur(s) au niveau requis`).join('\n')+'\nPlan suggéré : programmer la formation « Audit interne ISO » et la conduite de chariot en priorité.';
  if(q.includes('mandat')) return 'Mandats arrivant à échéance : Jules HOUESSOU et Estelle KPADONOU (délégués titulaires) le 15 oct. 2026. Pensez à organiser les élections.';
  if(q.includes('accus')||q.includes('lecture')) return 'Accusés de lecture manquants pour la politique SM v3 : '+DB.accuses.filter(a=>a.statut==='Non lu').map(a=>a.collaborateur).join(', ')+'.';
  if(q.includes('document')||q.includes('validation')) return 'Documents en cours de circuit :\n'+DB.documents.filter(d=>['Rédaction','Vérification','Approbation'].includes(d.statut)).map(d=>`• ${d.ref} ${d.intitule} — étape ${d.statut}`).join('\n');
  if(q.includes('procédure')||q.includes('7.5')||q.includes('trame')) return 'Trame proposée (ISO 9001 §7.5, commune aux normes actives) :\n1. Objet et domaine d\'application\n2. Références normatives et réglementaires\n3. Responsabilités (RACI)\n4. Logigramme et description des étapes\n5. Enregistrements et durée de conservation\n6. Indicateurs de suivi\n7. Historique des versions';
  if(q.includes('politique')) return `La politique SM ${DB.politique.version} a été signée par ${DB.politique.signataire} et publiée le ${fd(DB.politique.date)}.`;
  if(q.includes('preuve')||q.includes('couverture')||q.includes('faible')) { const L=DB.mapping.filter(m=>activeN().includes(m.norme)).sort((a,b)=>a.couverture-b.couverture).slice(0,4); return 'Exigences les moins démontrées :\n'+L.map(m=>`• ${NORMS[m.norme].code} §${m.article} ${m.libelle} — ${m.couverture} %`).join('\n'); }
  if(q.includes('partie')) return 'Parties intéressées critiques avec plan non mis en œuvre : '+DB.parties.filter(p=>!p.planMisEnOeuvre).map(p=>p.nom).join(', ')+'.';
  if(q.includes('enjeu')) return 'Enjeux suggérés non couverts : dépendance énergétique au réseau SBEE, disponibilité de main-d\'œuvre qualifiée en saison, exigences des acheteurs européens sur le devoir de vigilance.';
  if(q.includes('indicateur')) return 'Indicateurs suggérés pour la Maintenance : taux de disponibilité des lignes, MTBF des décortiqueuses, part de maintenance préventive, coût des pannes.';
  if(q.includes('récurrent')||q.includes('tendance')) return 'Récurrence détectée : 3 écarts liés aux protections machines (P05) en 6 mois. Suggestion : analyse Ishikawa sur la maîtrise des équipements.';
  if(q.includes('priorit')) return 'Priorités avant l\'audit AUD-2026-04 (14 oct.) :\n1. Compléter les bordereaux de déchets (NC-2026-015)\n2. Réaliser l\'exercice « déversement chimique » en retard\n3. Mettre à jour la fiche de maîtrise « produits chimiques » échue';
  if(q.includes('support')||q.includes('sensibilisation')) return 'Support proposé « Trier, c\'est valoriser » : 1 affiche A3 bilingue français/fongbé, 3 pictogrammes (coques, plastiques, déchets dangereux), 1 quiz de 5 questions pour la causerie. À valider avant diffusion.';
  return 'Je n\'ai pas trouvé d\'élément précis pour cette question dans vos données. Reformulez en citant un module, un processus ou une norme.';
}

function detail({title,sub='',rows=[],extra='',coll,id,edit=true,del=false,obs=false,acts=''}){
  const r=coll&&id?findRec(coll,id):null;
  const h=(r&&r.hist)||[{d:'2026-03-14 10:02',u:'Florence DOSSOU-YOVO',a:'Création (reprise de l\'existant)'}];
  drawer({title,sub,body:`<dl class="kv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>${extra}<div class="dsec"><h4>Historique</h4><ul class="timeline">${h.map(x=>`<li><b>${esc(x.a)}</b><br><span class="when">${esc(x.d)} — ${esc(x.u)}</span></li>`).join('')}</ul></div>`,
   foot:`${acts}${obs?`<button class="btn" onclick="markObsolete('${coll}','${id}')">${I(IC.archive,15)} Classer obsolète</button>`:''}${del?`<button class="btn danger" onclick="delRec('${coll}','${id}')">${I(IC.trash,15)} Supprimer</button>`:''}${edit&&coll?`<button class="btn primary" onclick="openForm('${coll}','${id}')">${I(IC.edit,15)} Modifier</button>`:''}`});
}
const linkItem=(t,s,go)=>`<button class="linkitem" onclick="closeModal('drawer');${go}"><span><b>${esc(t)}</b>${s?`<br><span class="muted">${esc(s)}</span>`:''}</span>${I(IC.arrow,14)}</button>`;
const block=(t,items)=>`<div class="dsec"><h4>${esc(t)} (${items.length})</h4>${items.length?`<div class="linklist">${items.join('')}</div>`:'<div class="small muted">Aucun élément lié pour le moment.</div>'}</div>`;

function genEnjeux(){ let n=0; DB.pestel.forEach(f=>{ if(DB.enjeux.some(e=>e.origine===f.id)) return; const axe=[...new Set(f.normes.map(x=>AXE_BY_NORM[x]))]; const e={id:uid('EN'),libelle:(f.qualification==='Positif'?'Saisir : ':'Maîtriser : ')+f.facteur.charAt(0).toLowerCase()+f.facteur.slice(1),source:'Externe (PESTEL)',qualification:f.qualification,axes:axe,normes:f.normes.slice(),origine:f.id,date:iso(TODAY),statut:'Actif'}; hist(e,'Généré automatiquement depuis le facteur '+f.id); DB.enjeux.unshift(e); n++; }); logAct(`a généré ${n} enjeu(x) depuis la matrice PESTEL`,'Enjeux'); toast(n?`${n} enjeu(x) généré(s) et associé(s) aux axes de la politique.`:'Tous les facteurs externes ont déjà un enjeu.'); S.tabs.enjeux='enj'; render(); }

function exportAnalyse(){ printDoc('Analyse SWOT / PESTEL et enjeux',`<h2>Facteurs internes (SWOT)</h2><table><tr><th>Type</th><th>Facteur</th><th>Description</th><th>Impact</th></tr>${DB.swot.map(s=>`<tr><td>${s.type}</td><td>${esc(s.libelle)}</td><td>${esc(s.description)}</td><td>${s.impact}/5</td></tr>`).join('')}</table><h2>Facteurs externes (PESTEL)</h2><table><tr><th>Dimension</th><th>Facteur</th><th>Qualification</th><th>Impact</th></tr>${DB.pestel.map(s=>`<tr><td>${s.dimension}</td><td>${esc(s.facteur)}</td><td>${s.qualification}</td><td>${s.impact}/5</td></tr>`).join('')}</table><h2>Enjeux</h2><table><tr><th>Enjeu</th><th>Source</th><th>Axes</th></tr>${DB.enjeux.map(e=>`<tr><td>${esc(e.libelle)}</td><td>${e.source}</td><td>${e.axes.map(axeName).join('<br>')}</td></tr>`).join('')}</table>`); }

  if(t==='enj') c=`<div class="card">${table({id:'enjeux',cols:[{l:'Enjeu',r:e=>`<span class="ttl">${esc(e.libelle)}</span>`},{l:'Source',k:'source'},{l:'Qualification',r:e=>sb(e.qualification)},{l:'Axes de la politique',r:e=>e.axes.map(a=>`<span class="badge b-blue">${a}</span>`).join(' ')},{l:'Normes',r:e=>nb(e.normes)},{l:'Identifié le',r:e=>fd(e.date)},{l:'Statut',r:e=>sb(e.statut)}],rows:DB.enjeux,click:'enjDetail',search:['libelle'],filters:[{k:'source',l:'Source',o:['Interne (SWOT)','Externe (PESTEL)']},{k:'axes',l:'Axe',o:()=>DB.axes.map(a=>[a.id,a.code])}],add:"openForm('enjeux')",addLabel:'Ajouter un enjeu',exportName:'Enjeux',extra:`<button class="btn sm" onclick="genEnjeux()">${I(IC.ai,14)} Générer depuis PESTEL</button>`})}</div>`;

function procDetail(id){ const p=DB.processus.find(x=>x.id===id);
  const links = block('Risques et opportunités (Module 3)',[...DB.risques.filter(r=>r.processus.includes(id)).map(r=>linkItem(r.id+' · '+r.intitule,'Risque '+r.type,"go('m3-risques')")),...DB.opportunites.filter(r=>r.processus.includes(id)).map(r=>linkItem(r.id+' · '+r.intitule,'Opportunité',"go('m3-risques')"))])+
   block('Objectifs et plans d\'action (Module 3)',DB.objectifs.filter(o=>o.processus.includes(id)).map(o=>linkItem(o.code+' · '+o.libelle,'Cible '+o.cible,"go('m3-objectifs')")))+
   block('Ressources (Module 4)',DB.ressources.filter(r=>r.processus===id).map(r=>linkItem(r.besoin,r.statut,"go('m4-ressources')")))+
   block('Actions de communication (Module 4)',DB.communications.filter(c=>c.processus===id).map(c=>linkItem(c.objectif,c.statut+' — '+fd(c.date),"go('m4-communication')")))+
   block('Documents (Module 5)',DB.documents.filter(d=>d.processus===id).map(d=>linkItem(d.ref+' · '+d.intitule,d.statut,"go('m5-ged')")))+
   block('Plans opérationnels et fiches de maîtrise (Module 5)',[...DB.plansOps.filter(x=>x.processus===id).map(x=>linkItem(x.plan,x.statut,"go('m5-planif')")),...DB.fichesMaitrise.filter(x=>x.processus===id).map(x=>linkItem(x.objet,'Fiche de maîtrise',"go('m5-fiches')"))])+
   block('Actions d\'amélioration (Module 6)',[...DB.ncs.filter(n=>n.processus===id).map(n=>linkItem(n.ref+' · '+n.description,n.statut,"go('m6-nc')")),...DB.indicateurs.filter(k=>k.processus===id).map(k=>linkItem('Indicateur : '+k.kpi,'Taux d\'atteinte '+taux(k)+' %',"go('m6-surveillance')"))]);
  detail({coll:'processus',id,title:p.code+' · '+p.intitule,sub:'Processus de '+p.categorie.toLowerCase(),rows:[['Pilote',esc(p.proprietaire)],['Finalité',esc(p.finalite)],['Entrées',esc(p.entrees)],['Sorties',esc(p.sorties)],['Indicateurs',esc(p.indicateurs)],['Normes',nb(p.normes)]],extra:links,obs:true}); }

const ACT_ST=['Mise en œuvre','En cours','Clôturé'];
function objProg(o){ return o.actions.length? o.actions.filter(a=>a.statut==='Clôturé').length/o.actions.length*100 : 0; }
function objLate(o){ return o.actions.some(a=>a.statut!=='Clôturé'&&days(a.echeance)<0); }
FORMS.objectifs={title:'Objectif',prefix:'OB',label:'libelle',mod:'Objectifs',wide:true,fields:[{k:'code',l:'Code',req:1},{k:'axe',l:'Orientation stratégique (Module 2)',t:'select',o:()=>DB.axes.map(a=>[a.id,a.code+' — '+a.libelle])},{k:'libelle',l:'Objectif',req:1,full:1},{k:'kpi',l:'Indicateur (KPI)',req:1},{k:'cible',l:'Cible',req:1},{k:'delai',l:'Délai',t:'date',req:1},{k:'efficacite',l:'Évaluation de l\'efficacité',t:'select',o:['Non évaluée','En cours d\'évaluation','Partiellement efficace','Efficace','Non efficace']},{k:'processus',l:'Processus concernés',t:'multi',o:procOpts,req:1},{k:'normes',l:'Normes',t:'norms',req:1}],def:()=>({code:'OB-05',axe:'AX3',libelle:'Réduire de 15 % la consommation d\'eau par tonne produite',kpi:'m³ d\'eau par tonne de produit fini',cible:'-15 % vs 2025',delai:'2027-06-30',efficacite:'Non évaluée',processus:['P05','P09'],normes:['14001'],actions:[]}),save:(r,n)=>{ if(n) r.actions=r.actions||[]; }};
const ACT_F=[{k:'libelle',l:'Action',req:1,full:1},{k:'responsable',l:'Responsable',t:'select',o:userNames},{k:'echeance',l:'Échéance',t:'date',req:1},{k:'statut',l:'Statut',t:'select',o:ACT_ST},{k:'observation',l:'Observation',t:'textarea',req:1}];

PAGES['m3-objectifs']={t:'3.1 Objectifs et plans d\'action',r:()=>{ const [t,tb]=tabs('obj',[['list','Liste des objectifs'],['proc','Vue par processus'],['axe','Vue par axe stratégique'],['act','Suivi des actions']]); const O=DB.objectifs.filter(inNorm);

  if(t==='proc') c=DB.processus.filter(p=>O.some(o=>o.processus.includes(p.id))).map(p=>`<div class="card mb"><div class="card-h"><h3>${p.code} · ${esc(p.intitule)}</h3><span class="small muted">Pilote : ${esc(p.proprietaire)}</span></div><div class="grid g3">${O.filter(o=>o.processus.includes(p.id)).map(card).join('')}</div></div>`).join('');

  if(t==='act'){ const L=[]; O.forEach(o=>o.actions.forEach((a,i)=>L.push({...a,id:o.id+'#'+i,obj:o.code,normes:o.normes,processus:o.processus})));
    c=`<div class="card">${table({id:'acts',cols:[{l:'Objectif',k:'obj'},{l:'Action',r:a=>`<span class="ttl">${esc(a.libelle)}</span>`},{l:'Responsable',k:'responsable'},{l:'Échéance',r:a=>dueBadge(a.echeance,a.statut==='Clôturé')},{l:'Statut',r:a=>sb(a.statut)},{l:'Observation',r:a=>`<span class="small">${esc(a.observation)}</span>`}],rows:L,click:"(i=>editAction(i.split('#')[0],+i.split('#')[1]))",search:['libelle','responsable'],filters:[{k:'statut',l:'Statut',o:ACT_ST},{k:'processus',l:'Processus',o:procOpts}],exportName:'Extraction_plans_action'})}</div>`; }
  return head(MOD_FULL.m3,'3.1 Objectifs et plans d\'action','Objectifs liés aux orientations stratégiques, avec KPI, cible, délai, processus et plan d\'action suivi jusqu\'à l\'évaluation de l\'efficacité.')+tb+c; }};

   extra:`<div class="dsec"><div class="card-h"><h4 style="margin:0">Plan d'action (${o.actions.length})</h4><button class="btn sm" onclick="editAction('${id}',-1)">${I(IC.plus,13)} Ajouter une action</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Action</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${o.actions.map((a,i)=>`<tr class="click" onclick="editAction('${id}',${i})"><td>${esc(a.libelle)}<br><span class="ref">${esc(a.observation)}</span></td><td>${esc(a.responsable)}</td><td>${dueBadge(a.echeance,a.statut==='Clôturé')}</td><td>${sb(a.statut)}</td></tr>`).join('')}</tbody></table></div></div>`,del:true}); }

FORMS.textes={title:'Texte réglementaire',prefix:'TX',label:'intitule',mod:'Veille',fields:[{k:'intitule',l:'Intitulé du texte',req:1,full:1},{k:'domaine',l:'Domaine',t:'select',o:['Santé et sécurité au travail','Environnement','Déchets','Protection des données','Social','Qualité et consommation','Fiscal']},{k:'datePublication',l:'Date de publication',t:'date',req:1},{k:'lien',l:'Lien source',req:1},{k:'statut',l:'Statut de conformité',t:'select',o:['Fait','Pas fait']},{k:'justificatif',l:'Justificatif du statut',t:'textarea',req:1},{k:'pieces',l:'Pièces justificatives (preuves d\'audit de conformité)',t:'file',req:1},{k:'echeance',l:'Prochaine évaluation',t:'date',req:1},{k:'responsable',l:'Responsable',t:'select',o:userNames},{k:'normes',l:'Normes',t:'norms',req:1}],def:()=>({intitule:'Arrêté interministériel fixant les normes de rejet des eaux usées industrielles',domaine:'Environnement',datePublication:'2021-06-15',lien:'https://sgg.gouv.bj',statut:'Pas fait',justificatif:'Analyse des rejets de la station d\'épuration à programmer',pieces:'Devis_laboratoire_analyses.pdf',echeance:addDays(45),responsable:'Arnaud TCHIBOZO',normes:['14001']})};
FORMS.declarations={title:'Déclaration de non-conformité réglementaire',prefix:'DC',label:'objet',mod:'Veille',fields:[{k:'texte',l:'Texte concerné',t:'select',o:()=>DB.textes.map(t=>[t.id,t.intitule.slice(0,80)])},{k:'objet',l:'Objet',req:1,full:1},{k:'cause',l:'Cause',t:'textarea',req:1},{k:'impact',l:'Impact',t:'textarea',req:1},{k:'planAction',l:'Plan d\'action',t:'textarea',req:1}],def:()=>({texte:'TX3',objet:'Registre des traitements de données incomplet',cause:'Nouveaux traitements (vidéosurveillance) non recensés',impact:'Non-respect du Code du numérique',planAction:'Mettre à jour le registre et informer le personnel',statut:'Brouillon',auteur:S.user.nom,date:iso(TODAY),commentaireDG:'Non soumise'})};
function declAct(id,act){ const d=DB.declarations.find(x=>x.id===id);
  if(act==='submit'){ d.statut='Soumise'; d.commentaireDG='En attente de décision du Directeur Général'; hist(d,'Soumise au Directeur Général'); logAct('a soumis la déclaration « '+d.objet+' » au DG','Veille','En attente'); toast('Déclaration soumise : le Directeur Général est notifié.'); }
  if(act==='ok'){ d.statut='Validée'; d.commentaireDG='Validée le '+fd(iso(TODAY))+' — liée au registre des non-conformités'; hist(d,'Validée par le DG'); const t=DB.textes.find(x=>x.id===d.texte)||{normes:['9001'],responsable:S.user.nom};
    const nc={id:uid('NC'),ref:'NC-2026-0'+(30+DB.ncs.length),categorie:'Non-conformité',source:'Veille réglementaire',description:d.objet,typeActe:'Conformité',cause:d.cause,action:d.planAction,lieu:ORG.nom,processus:'P02',normes:t.normes,statut:'En traitement',n1:'Validé',n2:'Approuvé',date:iso(TODAY),declarant:d.auteur,origine:'Déclaration '+d.id}; DB.ncs.unshift(nc);
    addRegistre('Non-conformité',d.objet,'Veille réglementaire ('+d.id+')','P02',t.normes,t.responsable);
    logAct('a validé la déclaration « '+d.objet+' » — écart lié au module Non-conformités','Veille'); toast('Déclaration validée : écart créé dans le module 6.4 et mise en conformité planifiée.'); }
  if(act==='ko'){ d.statut='Refusée'; d.commentaireDG='Refusée — complément demandé sur le plan d\'action'; hist(d,'Refusée par le DG, retour à l\'auteur'); logAct('a refusé la déclaration « '+d.objet+' »','Veille','Refusé'); toast('Déclaration refusée et renvoyée à l\'auteur.','warn'); }
  closeModal('drawer'); render(); }
function declDetail(id){ const d=DB.declarations.find(x=>x.id===id); const idx={Brouillon:0,Soumise:1,Validée:2,Refusée:2}[d.statut];
  drawer({title:d.objet,sub:'Déclaration '+d.id+' — '+fd(d.date)+' — '+d.auteur,body:wfHTML(['Rédaction','Soumise au DG',d.statut==='Refusée'?'Refusée':'Validée'],d.statut==='Validée'?3:idx,d.statut==='Refusée')+`<dl class="kv" style="margin-top:12px"><dt>Texte</dt><dd>${esc((DB.textes.find(t=>t.id===d.texte)||{}).intitule||'—')}</dd><dt>Cause</dt><dd>${esc(d.cause)}</dd><dt>Impact</dt><dd>${esc(d.impact)}</dd><dt>Plan d'action</dt><dd>${esc(d.planAction)}</dd><dt>Statut</dt><dd>${sb(d.statut)}</dd><dt>Décision du DG</dt><dd>${esc(d.commentaireDG)}</dd></dl>`,

PAGES['m3-veille']={t:'3.2 Veille et mise en conformité',r:()=>{ const [t,tb]=tabs('veille',[['reg','Registre réglementaire'],['cal','Calendrier d\'audit de conformité'],['dec','Déclarations au DG']]); const T=DB.textes.filter(inNorm);

function docAct(id,a){ const d=DB.documents.find(x=>x.id===id); let msg='';
  if(a==='submit'){ d.statut='Vérification'; msg='soumis à vérification — vérificateur notifié'; }
  if(a==='verify'){ d.statut='Approbation'; msg='vérifié — approbateur notifié'; }
  if(a==='approve'){ d.statut='Diffusé'; d.version=d.versions.at(-1).v; d.accuses=0; msg='approuvé et diffusé ; la version précédente est archivée'; }
  if(a==='refuse'){ const c=prompt('Motif du refus (renvoyé à l\'auteur) :','Préciser les responsabilités et les enregistrements associés'); if(c===null) return; d.statut='Rédaction'; d.refus=c; msg='refusé et renvoyé à l\'auteur — motif : '+c; }
  hist(d,'Document '+msg); logAct(`a ${msg.split(' ')[0]} le document ${d.ref}`,'GED',d.statut); toast(`${d.ref} ${msg}.`); render(); docDetail(id); }
function newVersion(id){ const d=DB.documents.find(x=>x.id===id); const last=d.versions.at(-1); const F=[{k:'contenu',l:'Contenu de la nouvelle version',t:'textarea',req:1},{k:'motif',l:'Motif de la modification',req:1,full:1}];
  modal({title:'Ouvrir une nouvelle version — '+d.ref,sub:'La version diffusée reste en vigueur jusqu\'à l\'approbation de la nouvelle.',body:`<div id="nvf">${formHTML(F,{contenu:last.contenu+'\nAjout : revue annuelle obligatoire par le pilote du processus.',motif:'Mise à jour après la revue documentaire 2026'})}</div>`,foot:`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="const x=readForm($('#nvf'),[{k:'contenu',t:'textarea',req:1},{k:'motif',req:1}]);if(x){const d=DB.documents.find(y=>y.id==='${id}');const v=String(parseInt(d.versions.at(-1).v)+1);d.versions.push({v,date:iso(TODAY),auteur:S.user.nom,contenu:x.contenu});d.statut='Rédaction';hist(d,'Version '+v+' ouverte : '+x.motif);logAct('a ouvert la version '+v+' de '+d.ref,'GED','Brouillon');closeModal();render();docDetail('${id}')}">Créer la version</button>`}); }
function diffHTML(a,b){ const A=a.split('\n'),B=b.split('\n'); return [...A.filter(l=>!B.includes(l)).map(l=>`<div class="diff-del">− ${esc(l)}</div>`),...B.map(l=>A.includes(l)?`<div>  ${esc(l)}</div>`:`<div class="diff-add">+ ${esc(l)}</div>`)].join(''); }
function compareDoc(id){ const d=DB.documents.find(x=>x.id===id); if(d.versions.length<2){ toast('Une seule version existe pour ce document.','warn'); return; } const opt=d.versions.map(v=>`<option value="${v.v}">Version ${v.v} — ${fd(v.date)}</option>`).join('');
  const show=()=>{ const a=d.versions.find(v=>v.v===$('#va').value), b=d.versions.find(v=>v.v===$('#vb').value); $('#diff').innerHTML=diffHTML(a.contenu,b.contenu); };
  modal({id:'modal2',title:'Comparer deux versions — '+d.ref,wide:true,body:`<div class="btn-row mb"><select class="sel" id="va">${opt}</select>${I(IC.arrow,15)}<select class="sel" id="vb">${opt}</select></div><div class="doc-preview" id="diff" style="font-family:ui-monospace,monospace;font-size:12.5px"></div><div class="legend" style="margin-top:8px"><span><i style="background:#DDF1E4"></i>Ajouté</span><span><i style="background:#F8DEDA"></i>Supprimé</span></div>`});
  $('#va').value=d.versions.at(-2).v; $('#vb').value=d.versions.at(-1).v; $('#va').onchange=show; $('#vb').onchange=show; show(); }
function diffuser(id){ const d=DB.documents.find(x=>x.id===id); const F=[{k:'diffusion',l:'Liste de diffusion',req:1,full:1},{k:'accuse',l:'Exiger un accusé de lecture',t:'toggle',lbl:'Oui'}]; modal({id:'modal2',title:'Diffusion contrôlée — '+d.ref,body:`<div id="dff">${formHTML(F,{diffusion:d.diffusion,accuse:true})}</div>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn primary" onclick="const x=readForm($('#dff'),[{k:'diffusion',req:1},{k:'accuse',t:'toggle'}]);if(x){const d=DB.documents.find(y=>y.id==='${id}');d.diffusion=x.diffusion;d.accuses=0;hist(d,'Diffusé à : '+x.diffusion);logAct('a diffusé '+d.ref,'GED');closeModal('modal2');toast('Diffusion envoyée, accusés de lecture attendus.');docDetail('${id}')}">${I(IC.send,15)} Diffuser</button>`}); }
function docDetail(id){ const d=DB.documents.find(x=>x.id===id); const idx={Rédaction:0,Vérification:1,Approbation:2,Diffusé:4,Refusé:0,Obsolète:4}[d.statut];

  detail({coll:'documents',id,title:d.ref+' · '+d.intitule,sub:d.type+' — version '+d.versions.at(-1).v,rows:[['Workflow',wfHTML(['Rédaction','Vérification','Approbation','Diffusion'],idx)+(d.refus&&d.statut==='Rédaction'?`<div class="note warn">Refus précédent : ${esc(d.refus)}</div>`:'')],['Statut',sb(d.statut)],['Propriétaire',esc(d.proprietaire)],['Processus',esc(procName(d.processus))],['Normes',nb(d.normes)],['Créé le',fd(d.dateCreation)],['Prochaine revue',dueBadge(d.dateRevue,d.statut==='Obsolète')],['Droits d\'accès',esc(d.droits)],['Diffusion',esc(d.diffusion)]],

FORMS.urgences={title:'Fiche de situation d\'urgence',prefix:'SU',label:'type',mod:'Situations d\'urgence',wide:true,fields:[{k:'type',l:'Type de situation d\'urgence',req:1,full:1},{k:'procedure',l:'Procédure de référence',req:1},{k:'responsables',l:'Responsables',req:1},{k:'consignes',l:'Consignes',t:'textarea',req:1},{k:'moyens',l:'Moyens de secours',t:'textarea',req:1},{k:'risques',l:'Risques associés (Module 3)',t:'multi',o:riskOpts,req:1},{k:'sites',l:'Sites d\'application (Module 1.3)',t:'multi',o:siteOpts,req:1}],def:()=>({type:'Inondation de l\'entrepôt de Porto-Novo',procedure:'PR-HSE-11 Plan inondation',responsables:'Martial ADJIBADÉ',consignes:'Surélever les palettes, couper l\'électricité, évacuer le personnel',moyens:'Pompes de relevage, sacs de sable, palettes hautes',risques:['R06'],sites:['Entrepôt de Porto-Novo'],exercices:[]}),save:(r,n)=>{ if(n) r.exercices=[]; }};
const EX_F=[{k:'date',l:'Date de l\'exercice',t:'date',req:1},{k:'participants',l:'Participants',req:1},{k:'scenario',l:'Scénario',t:'textarea',req:1},{k:'procedure',l:'Procédure / instruction jointe',t:'file',req:1}];
const CR_F=[{k:'compteRendu',l:'Compte-rendu de l\'exercice',t:'textarea',req:1},{k:'actions',l:'Actions correctives issues du retour d\'expérience',t:'textarea',req:1},{k:'creer',l:'Créer ces actions dans le registre d\'amélioration',t:'toggle',lbl:'Oui, des actions correctives sont nécessaires'}];
function addExercice(uid_){ const u=DB.urgences.find(x=>x.id===uid_); modal({id:'modal2',title:'Planifier un exercice de simulation',sub:u.type,body:`<div id="exf">${formHTML(EX_F,{date:addDays(40),participants:'Équipiers EPI et personnel de jour',scenario:'Déclenchement de la situation « '+u.type+' » en heures ouvrées',procedure:u.procedure.split(' ')[0]+'.pdf'})}</div>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn primary" onclick="const d=readForm($('#exf'),EX_F);if(d){const u=DB.urgences.find(x=>x.id==='${uid_}');u.exercices.push({...d,statut:'Planifié',compteRendu:'—',actions:'—'});hist(u,'Exercice planifié le '+fd(d.date));logAct('a planifié un exercice : '+u.type,'Situations d\\'urgence','Planifié');closeModal('modal2');toast('Exercice planifié — participants notifiés.');urgDetail('${uid_}');render()}">Planifier</button>`}); }
function crExercice(uid_,i){ const u=DB.urgences.find(x=>x.id===uid_); modal({id:'modal2',title:'Enregistrer le compte-rendu',sub:u.type+' — '+fd(u.exercices[i].date),body:`<div id="crf">${formHTML(CR_F,{compteRendu:'Évacuation réalisée en 4 min 10 s. Alarme audible partout sauf à la chambre froide.',actions:'Installer un flash lumineux dans la chambre froide — Bertin SOSSA — 30 jours',creer:true})}</div>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn primary" onclick="const d=readForm($('#crf'),CR_F);if(d){const u=DB.urgences.find(x=>x.id==='${uid_}');Object.assign(u.exercices[${i}],{compteRendu:d.compteRendu,actions:d.actions,statut:'Réalisé'});if(d.creer)addRegistre('Action corrective',d.actions,'Exercice : '+u.type,'P11',['45001','14001'],u.responsables.split(' (')[0]);hist(u,'Compte-rendu enregistré');logAct('a enregistré le compte-rendu de l\\'exercice '+u.type,'Situations d\\'urgence');closeModal('modal2');toast(d.creer?'Compte-rendu enregistré et actions correctives créées.':'Compte-rendu enregistré.');urgDetail('${uid_}');render()}">Enregistrer</button>`}); }
function urgDetail(id){ const u=DB.urgences.find(x=>x.id===id);
  detail({coll:'urgences',id,title:u.type,sub:u.procedure,rows:[['Consignes',esc(u.consignes)],['Moyens de secours',esc(u.moyens)],['Responsables',esc(u.responsables)],['Sites',u.sites.map(esc).join('<br>')]],extra:block('Risques associés',u.risques.map(r=>{const k=DB.risques.find(x=>x.id===r);return linkItem(r+' · '+(k?k.intitule:''),k?k.type:'',"go('m3-risques')")}))+
   `<div class="dsec"><div class="card-h"><h4 style="margin:0">Exercices de simulation (${u.exercices.length})</h4><button class="btn sm" onclick="addExercice('${id}')">${I(IC.plus,13)} Planifier un exercice</button></div>${u.exercices.map((e,i)=>`<div class="card flat" style="margin-bottom:8px;padding:12px"><div class="btn-row" style="justify-content:space-between"><b>${fd(e.date)}</b>${sb(e.statut==='Planifié'&&days(e.date)<0?'En retard':e.statut)}</div><div class="small" style="margin-top:4px">${esc(e.scenario)}<br><span class="muted">Participants : ${esc(e.participants)} — Procédure jointe : ${esc(e.procedure)}</span></div>${e.statut==='Réalisé'?`<div class="small" style="margin-top:6px"><b>Compte-rendu :</b> ${esc(e.compteRendu)}<br><b>Actions :</b> ${esc(e.actions)}</div>`:`<button class="btn sm" style="margin-top:8px" onclick="crExercice('${id}',${i})">Enregistrer le compte-rendu</button>`}</div>`).join('')}</div>`,obs:true}); }
PAGES['m5-urgences']={t:'5.3 Situations d\'urgence',r:()=>{ const late=[]; DB.urgences.forEach(u=>u.exercices.forEach(e=>{ if(e.statut==='En retard'||(e.statut==='Planifié'&&days(e.date)<0)) late.push(u.type); }));
  return head(MOD_FULL.m5,'5.3 Situations d\'urgence','Fiches par type de situation, liées aux risques et aux sites, exercices de simulation avec compte-rendu et actions correctives.',`<button class="btn primary" onclick="openForm('urgences')">${I(IC.plus,15)} Créer une fiche</button>`)+(late.length?`<div class="note warn mb">${I(IC.warn,15)} Exercice(s) non réalisé(s) dans les délais : ${late.map(esc).join(', ')}.</div>`:'')+
  `<div class="grid g3">${DB.urgences.filter(u=>!u.obsolete).map(u=>{const nx=u.exercices.filter(e=>e.statut!=='Réalisé').sort((a,b)=>new Date(a.date)-new Date(b.date))[0];return `<div class="card" style="cursor:pointer" onclick="urgDetail('${u.id}')"><div class="btn-row" style="justify-content:space-between"><div class="stat-ic">${I(IC.warn,18)}</div><span class="small muted">${u.exercices.length} exercice(s)</span></div><h3 style="font-size:15px;margin:10px 0 4px">${esc(u.type)}</h3><div class="small muted">${esc(u.procedure)}</div><div class="small" style="margin-top:8px">${esc(u.sites.join(', '))}</div><div style="margin-top:8px">${u.risques.map(r=>`<span class="badge b-grey">${r}</span>`).join(' ')}</div><hr class="sep"><div class="small">${nx?`Prochain exercice : <b>${fd(nx.date)}</b> ${sb(nx.statut==='Planifié'&&days(nx.date)<0?'En retard':nx.statut)}`:'Aucun exercice planifié'}</div></div>`}).join('')}</div>`; }};

FORMS.indicateurs={title:'Indicateur (KPI)',prefix:'KP',label:'kpi',mod:'Surveillance',fields:[{k:'kpi',l:'Indicateur',req:1,full:1},{k:'objectif',l:'Objectif rattaché',t:'select',o:()=>['—',...DB.objectifs.map(o=>o.code)]},{k:'sens',l:'Sens d\'amélioration',t:'select',o:[['hausse','Plus haut = mieux'],['baisse','Plus bas = mieux']]},{k:'cible',l:'Cible',t:'number',req:1},{k:'unite',l:'Unité',req:1},{k:'valeur',l:'Dernière valeur mesurée',t:'number',req:1},{k:'moyen',l:'Moyen de mesure',req:1},{k:'echeance',l:'Échéance',t:'date',req:1},{k:'processus',l:'Processus',t:'select',o:procOpts},{k:'responsable',l:'Responsable',t:'select',o:userNames},{k:'action',l:'Action associée',req:1,full:1}],def:()=>({kpi:'Consommation d\'eau par tonne produite',objectif:'—',sens:'baisse',cible:4.5,unite:'m³/t',valeur:5.2,moyen:'Relevé mensuel des compteurs',echeance:'2027-06-30',processus:'P05',responsable:'Serge KOUTON',action:'Installer des compteurs divisionnaires'}),save:r=>{ if(taux(r)<80) return 'Indicateur enregistré — écart significatif détecté, alerte envoyée à '+r.responsable+'.'; }};
FORMS.prestataires={title:'Intervenant externe',prefix:'EX',label:'nom',mod:'Surveillance',fields:[{k:'nom',l:'Nom',req:1},{k:'categorie',l:'Catégorie',t:'select',o:['Critique','Classique']},{k:'debut',l:'Début de collaboration',t:'date',req:1},{k:'frequence',l:'Fréquence d\'évaluation',t:'select',o:['Trimestrielle','Semestrielle','Annuelle']},{k:'processus',l:'Processus',t:'select',o:procOpts},{k:'responsable',l:'Responsable de l\'évaluation',t:'select',o:userNames},{k:'champ',l:'Champ d\'évaluation',t:'textarea',req:1}],def:()=>({nom:'SOBEPRAN Emballages',categorie:'Critique',debut:'2024-05-01',frequence:'Semestrielle',processus:'P05',responsable:'Aïcha BIO SIKA',champ:'Conformité des sachets sous vide, délais de livraison',notes:{qualite:3,delai:3,securite:3,environnement:3}})};
