function evalPresta(id){ const p=DB.prestataires.find(x=>x.id===id); const F=[{k:'qualite',l:'Qualité (1 à 5)',t:'scale'},{k:'delai',l:'Respect des délais (1 à 5)',t:'scale'},{k:'securite',l:'Sécurité / sécurité de l\'information (1 à 5)',t:'scale'},{k:'environnement',l:'Environnement (1 à 5)',t:'scale'}];
  modal({title:'Évaluer — '+p.nom,sub:'Score calculé automatiquement. Sous 60 %, un plan de progrès est requis.',body:`<div id="evf">${formHTML(F,p.notes)}</div>`,foot:`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="const d=readForm($('#evf'),[{k:'qualite',t:'scale',req:1},{k:'delai',t:'scale',req:1},{k:'securite',t:'scale',req:1},{k:'environnement',t:'scale',req:1}]);if(d){const p=DB.prestataires.find(x=>x.id==='${id}');p.notes=d;hist(p,'Évaluation : '+pScore(p)+' %');logAct('a évalué '+p.nom+' ('+pScore(p)+' %)','Surveillance');closeModal();toast('Score : '+pScore(p)+' %'+(pScore(p)<60?' — plan de progrès requis.':'.'));render()}">Enregistrer l'évaluation</button>`}); }
function miniBars(vals,labels,color,unit=''){ const m=Math.max(...vals)*1.15; return `<div class="bars" style="height:150px;padding-left:4px">${vals.map((v,i)=>`<div class="bar on" style="cursor:default"><span style="font-weight:600;color:var(--ink)">${String(v).replace('.',',')}${unit}</span><i style="height:${v/m*110}px;background:${color}"></i><span>${labels[i]}</span></div>`).join('')}</div>`; }
PAGES['m6-surveillance']={t:'6.1 Surveillance et mesures',r:()=>{ const [t,tb]=tabs('surv',[['kpi','Indicateurs'],['tdb','Tableau de bord'],['ext','Intervenants externes'],['stat','Statistiques de surveillance'],['veille','Registre de veille']]); const K=DB.indicateurs;
  let c='';
  if(t==='kpi') c=`<div class="card">${table({id:'kpi',cols:[{l:'Indicateur',r:k=>`<span class="ttl">${esc(k.kpi)}</span><br><span class="ref">Objectif ${esc(k.objectif)}</span>`},{l:'Cible',r:k=>`${String(k.cible).replace('.',',')} ${esc(k.unite)}`},{l:'Moyen de mesure',k:'moyen'},{l:'Échéance',r:k=>fd(k.echeance)},{l:'Processus / Responsable',r:k=>`${esc(procShort(k.processus))}<br><span class="ref">${esc(k.responsable)}</span>`},{l:'Action',r:k=>`<span class="small">${esc(k.action)}</span>`},{l:'Valeur',r:k=>`${String(k.valeur).replace('.',',')} ${esc(k.unite)}`},{l:'Taux d\'atteinte',r:k=>prog(taux(k),80,60)+(taux(k)<80?'<span class="badge b-red">écart significatif</span>':'')}],rows:K,click:"(i=>openForm('indicateurs',i))",search:['kpi','responsable'],filters:[{k:'processus',l:'Processus',o:procOpts}],add:"openForm('indicateurs')",addLabel:'Définir un indicateur',exportName:'Indicateurs',norm:false})}</div>`;
  if(t==='tdb') c=`<div class="grid g3">${DB.processus.filter(p=>K.some(k=>k.processus===p.id)).map(p=>{const L=K.filter(k=>k.processus===p.id);const m=Math.round(L.reduce((a,k)=>a+taux(k),0)/L.length);return `<div class="card"><div class="card-h"><div><h3 style="font-size:14.5px">${p.code} · ${esc(p.intitule)}</h3><div class="sub">${esc(p.proprietaire)} — ${esc(DIRECTIONS.find(d=>USERS.find(u=>u.nom===p.proprietaire&&u.direction===d))||'')}</div></div><span class="badge ${m<80?'b-amber':'b-green'}">${m} %</span></div>${L.map(k=>`<div class="small" style="margin-bottom:8px">${esc(k.kpi)}${prog(taux(k),80,60)}</div>`).join('')}</div>`}).join('')}</div>`;
  if(t==='ext') c=`<div class="card">${table({id:'ext',cols:[{l:'Intervenant',r:p=>`<span class="ttl">${esc(p.nom)}</span><br><span class="ref">Depuis le ${fd(p.debut)}</span>`},{l:'Catégorie',r:p=>sb(p.categorie)},{l:'Fréquence',k:'frequence'},{l:'Champ d\'évaluation',r:p=>`<span class="small">${esc(p.champ)}</span>`},{l:'Processus / Responsable',r:p=>`${esc(procShort(p.processus))}<br><span class="ref">${esc(p.responsable)}</span>`},{l:'Score',r:p=>prog(pScore(p),70,60)},{l:'',r:p=>`<button class="btn sm" onclick="event.stopPropagation();evalPresta('${p.id}')">Évaluer</button>`}],rows:DB.prestataires,click:"(i=>openForm('prestataires',i))",search:['nom','champ'],filters:[{k:'categorie',l:'Catégorie',o:['Critique','Classique']},{k:'processus',l:'Processus',o:procOpts},{k:'responsable',l:'Responsable',o:userNames}],add:"openForm('prestataires')",addLabel:'Ajouter un intervenant',exportName:'Intervenants_externes',norm:false})}</div>`;
  if(t==='stat'){ const s=DB.statsSurv; c=`<div class="grid g3"><div class="card"><div class="card-h"><h3>Incidents</h3><span class="small muted">Mars à sept. 2026</span></div>${miniBars(s.incidents,s.mois,'var(--red)')}</div><div class="card"><div class="card-h"><h3>Dysfonctionnements</h3><span class="small muted">Mars à sept. 2026</span></div>${miniBars(s.dysfonctionnements,s.mois,'#D08B1E')}</div><div class="card"><div class="card-h"><h3>Déchets produits (t)</h3><span class="small muted">Mars à sept. 2026</span></div>${miniBars(s.dechets,s.mois,'var(--green)')}</div></div><p class="small muted">Statistiques propres à la surveillance, sans dupliquer les indicateurs suivis dans les autres modules.</p>`; }

  return head(MOD_FULL.m6,'6.1 Surveillance et mesures','Objectifs et KPI avec calcul automatique du taux d\'atteinte, évaluation des intervenants externes et statistiques de surveillance.')+tb+c; }};

function audAct(id,a){ const x=DB.audits.find(y=>y.id===id); const m={diff:['Plan diffusé','Plan d\'audit diffusé aux audités et à l\'auditeur'],start:['En cours','Audit démarré'],alert:[x.statut,'Alerte envoyée à '+x.auditeur]}[a]; x.statut=m[0]; hist(x,m[1]); logAct(m[1]+' ('+x.ref+')','Audits'); toast(m[1]+'.'); render(); audDetail(id); }
function audReport(id){ const x=DB.audits.find(y=>y.id===id); const F=[{k:'rapport',l:'Rapport d\'audit',t:'file',req:1},{k:'compteRendu',l:'Compte-rendu de la réunion de clôture',t:'textarea',req:1}]; modal({id:'modal2',title:'Déposer le rapport — '+x.ref,body:`<div id="arf">${formHTML(F,{rapport:'Rapport_'+x.ref+'.pdf',compteRendu:'Réunion de clôture tenue avec le pilote ; constats acceptés.'})}</div>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn primary" onclick="const d=readForm($('#arf'),[{k:'rapport',t:'file',req:1},{k:'compteRendu',t:'textarea',req:1}]);if(d){const x=DB.audits.find(y=>y.id==='${id}');x.rapport=d.rapport;x.compteRendu=d.compteRendu;x.statut='Rapport déposé';hist(x,'Rapport déposé');logAct('a déposé le rapport '+x.ref,'Audits');closeModal('modal2');render();audDetail('${id}')}">Déposer</button>`}); }
function addConstat(id){ const x=DB.audits.find(y=>y.id===id); modal({id:'modal2',title:'Ajouter un constat — '+x.ref,body:`<div id="csf">${formHTML(CONST_F,{type:'NC mineure',processus:x.perimetre,description:'Enregistrements de contrôle non signés sur 3 jours'})}</div>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn primary" onclick="const d=readForm($('#csf'),CONST_F);if(d){DB.audits.find(y=>y.id==='${id}').constats.push(d);closeModal('modal2');audDetail('${id}');render()}">Ajouter</button>`}); }
function audClose(id){ const x=DB.audits.find(y=>y.id===id); let n=0; x.constats.filter(c=>c.type!=='Point fort').forEach(c=>{ addRegistre(c.type.startsWith('NC')?'Non-conformité':'Observation',c.description,'Audit '+x.ref,c.processus,x.normes,procOwner(c.processus)); n++; }); x.statut='Clôturé'; hist(x,'Audit clôturé — '+n+' action(s) enregistrée(s) au registre'); logAct('a clôturé '+x.ref+' ('+n+' action(s) au registre)','Audits'); toast(n+' action(s) enregistrée(s) automatiquement dans le registre d\'amélioration continue.'); closeModal('drawer'); render(); }
function audDetail(id){ const x=DB.audits.find(y=>y.id===id); const idx=AUD_ST.indexOf(x.statut); const d=days(x.date);
  const acts={Planifié:`<button class="btn" onclick="audAct('${id}','alert')">${I(IC.bell,15)} Alerter l'auditeur</button><button class="btn primary" onclick="audAct('${id}','diff')">${I(IC.send,15)} Diffuser le plan</button>`,'Plan diffusé':`<button class="btn primary" onclick="audAct('${id}','start')">Démarrer l'audit</button>`,'En cours':`<button class="btn" onclick="addConstat('${id}')">${I(IC.plus,15)} Ajouter un constat</button><button class="btn primary" onclick="audReport('${id}')">${I(IC.up,15)} Déposer le rapport</button>`,'Rapport déposé':`<button class="btn" onclick="addConstat('${id}')">${I(IC.plus,15)} Ajouter un constat</button><button class="btn primary" onclick="audClose('${id}')">${I(IC.check,15)} Clôturer</button>`,Clôturé:''}[x.statut];
  detail({coll:'audits',id,title:x.ref+' · '+x.titre,sub:fd(x.date)+(d>0&&x.statut!=='Clôturé'?' — J-'+d:''),rows:[['Avancement',wfHTML(AUD_ST,x.statut==='Clôturé'?5:idx)],['Périmètre',esc(procName(x.perimetre))],['Normes (grille fusionnée)',nb(x.normes)],['Auditeur',esc(x.auditeur)],['Rapport',esc(x.rapport)],['Compte-rendu',esc(x.compteRendu||(x.statut==='Clôturé'?'Réunion de clôture tenue, constats acceptés':'—'))]],
   extra:`<div class="dsec"><h4>Grille d'audit générée</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Norme</th><th>Article</th><th>Exigence</th></tr></thead><tbody>${DB.mapping.filter(m=>x.normes.includes(m.norme)).slice(0,8).map(m=>`<tr><td>${nb([m.norme])}</td><td>§${m.article}</td><td>${esc(m.libelle)}</td></tr>`).join('')}</tbody></table></div></div><div class="dsec"><h4>Constats (${x.constats.length})</h4>${x.constats.map(c=>`<div class="alert-item"><div>${sb(c.type)}</div><div class="small">${esc(c.description)}<br><span class="muted">${esc(procName(c.processus))}</span></div></div>`).join('')||'<div class="small muted">Aucun constat saisi.</div>'}</div>`,edit:x.statut!=='Clôturé',acts}); }
function campaignReport(){ const A=DB.audits; printDoc('Rapport compilé — campagne d\'audit 2026',`<p>${A.length} audits programmés, ${A.filter(a=>a.statut==='Clôturé').length} clôturés. ${A.reduce((s,a)=>s+a.constats.length,0)} constats.</p><table><tr><th>Audit</th><th>Date</th><th>Périmètre</th><th>Normes</th><th>Auditeur</th><th>Statut</th><th>Constats</th></tr>${A.map(a=>`<tr><td>${a.ref} ${esc(a.titre)}</td><td>${fd(a.date)}</td><td>${esc(procShort(a.perimetre))}</td><td>${a.normes.map(n=>NORMS[n].code).join(', ')}</td><td>${esc(a.auditeur)}</td><td>${a.statut}</td><td>${a.constats.map(c=>c.type+' : '+esc(c.description)).join('<br>')||'—'}</td></tr>`).join('')}</table>`); }

function revAction(id){ const F=[{k:'libelle',l:'Action décidée',req:1,full:1},{k:'responsable',l:'Responsable',t:'select',o:userNames},{k:'echeance',l:'Échéance',t:'date',req:1},{k:'statut',l:'Statut',t:'select',o:ACT_ST}]; modal({id:'modal2',title:'Ajouter une action au plan de la revue',body:`<div id="raf">${formHTML(F,{libelle:'Réaliser le test de restauration de l\'ERP avant fin octobre',responsable:'Cédric AGBODJAN',echeance:addDays(35),statut:'Mise en œuvre'})}</div>`,foot:`<button class="btn" onclick="closeModal('modal2')">Annuler</button><button class="btn primary" onclick="const d=readForm($('#raf'),[{k:'libelle',req:1},{k:'responsable',t:'select'},{k:'echeance',t:'date',req:1},{k:'statut',t:'select'}]);if(d){DB.revues.find(x=>x.id==='${id}').actions.push(d);closeModal('modal2');revDetail('${id}');render()}">Ajouter</button>`}); }
function revClose(id){ const r=DB.revues.find(x=>x.id===id); r.statut='Clôturée'; r.actions.forEach(a=>addRegistre('Action de revue',a.libelle,'Revue '+r.ref,'P01',r.normes,a.responsable)); const d=new Date(r.date); d.setMonth(d.getMonth()+6);
  const nx={id:uid('RV'),ref:r.ref.replace(/\d{4}/,String(d.getFullYear()))+'-suiv',date:iso(d),type:r.type,normes:r.normes.slice(),statut:'Préparée',ordreDuJour:['Suivi des actions de la revue '+r.ref,...r.ordreDuJour.filter(o=>!o.startsWith('Suivi des actions'))],rapportEntree:'Généré automatiquement à la clôture de '+r.ref+' — sera complété à J-15.',pv:'—',actions:[]}; DB.revues.push(nx);

function revDetail(id){ const r=DB.revues.find(x=>x.id===id);
  detail({coll:'revues',id,title:r.ref+' · '+r.type,sub:fd(r.date),rows:[['Statut',sb(r.statut)],['Normes',nb(r.normes)],['Ordre du jour',`<ol style="margin:0;padding-left:18px">${r.ordreDuJour.map(o=>`<li>${esc(o)}</li>`).join('')}</ol>`],['Rapport d\'entrée',esc(r.rapportEntree)+(r.statut!=='Clôturée'?`<br><button class="btn sm" style="margin-top:6px" onclick="const r=DB.revues.find(x=>x.id==='${id}');r.rapportEntree=rapportAuto();hist(r,'Rapport d\\'entrée compilé automatiquement');revDetail('${id}')">${I(IC.ai,13)} Compiler depuis les modules</button>`:'')],['Procès-verbal',esc(r.pv)]],
   extra:`<div class="dsec"><div class="card-h"><h4 style="margin:0">Plan d'action (${r.actions.length})</h4>${r.statut!=='Clôturée'?`<button class="btn sm" onclick="revAction('${id}')">${I(IC.plus,13)} Ajouter une action</button>`:''}</div>${r.actions.map(a=>`<div class="alert-item"><div style="flex:1"><div class="t">${esc(a.libelle)}</div><div class="d">${esc(a.responsable)} — ${fd(a.echeance)}</div></div>${sb(a.statut)}</div>`).join('')||'<div class="small muted">Aucune action décidée pour le moment.</div>'}</div>`,edit:r.statut!=='Clôturée',acts:r.statut!=='Clôturée'?`<button class="btn" onclick="printDoc('PV ${r.ref}','<h2>Ordre du jour</h2><ol>'+DB.revues.find(x=>x.id==='${id}').ordreDuJour.map(o=>'<li>'+o+'</li>').join('')+'</ol><h2>Rapport d\\'entrée</h2><p>'+DB.revues.find(x=>x.id==='${id}').rapportEntree+'</p><h2>PV</h2><p>'+DB.revues.find(x=>x.id==='${id}').pv+'</p>')">${I(IC.doc,15)} PV (PDF)</button><button class="btn primary" onclick="revClose('${id}')">${I(IC.check,15)} Clôturer la revue</button>`:''}); }
PAGES['m6-revues']={t:'6.3 Revues',r:()=>head(MOD_FULL.m6,'6.3 Revues','Ordre du jour, rapport d\'entrée, réunion de pilotage, procès-verbal et plan d\'action ; l\'ordre du jour de la revue suivante est préparé automatiquement.',`<button class="btn primary" onclick="openForm('revues')">${I(IC.plus,15)} Créer une revue</button>`)+

const NC_CAT=['Non-conformité','Accident / incident','Piste d\'amélioration','Observation'];
function ncFields(r){ const base=[{k:'categorie',l:'Catégorie',t:'select',o:NC_CAT},{k:'source',l:'Source',t:'select',o:()=>DB.sourcesNC},{k:'description',l:'Description',t:'textarea',req:1},{k:'typeActe',l:'Type d\'acte',t:'select',o:['Conformité','Dysfonctionnement'],h:'Conformité : cause + action ; dysfonctionnement : écart de fonctionnement'},{k:'processus',l:'Processus',t:'select',o:procOpts},{k:'lieu',l:'Lieu',req:1},{k:'date',l:'Date',t:'date',req:1},{k:'normes',l:'Normes',t:'norms',req:1},{k:'cause',l:r.categorie==='Accident / incident'?'Cause':'Cause (analyse 5 Pourquoi / Ishikawa)',t:'textarea',req:1},{k:'action',l:r.categorie==='Accident / incident'?'Acte / décision':r.categorie==='Piste d\'amélioration'||r.categorie==='Observation'?'Plan d\'action généré':'Action corrective',t:'textarea',req:1}];
  if(r.categorie==='Accident / incident') base.push({k:'miseEnOeuvre',l:'Mise en œuvre',t:'textarea',req:1}); return base; }
FORMS.ncs={title:'Déclaration',prefix:'NC',label:'description',mod:'Non-conformités',wide:true,fields:(r)=>ncFields(r),def:()=>({categorie:'Non-conformité',source:'Terrain',description:'Palettes de noix stockées directement au sol dans la zone B',typeActe:'Conformité',processus:'P04',lieu:'Magasin matières premières — zone B',date:iso(TODAY),normes:['9001'],cause:'Manque de palettes après la livraison du 18/09',action:'Commander 150 palettes et rappeler la consigne au magasinier',statut:'Déclarée',n1:'En attente',n2:'En attente',declarant:S.user.nom,origine:'Terrain'}),save:(r,n)=>{ if(n){ const pre={'Non-conformité':'NC','Accident / incident':'INC','Piste d\'amélioration':'AM','Observation':'OBS'}[r.categorie]; r.ref=pre+'-2026-0'+(25+DB.ncs.length); return r.ref+' déclaré(e) — le pilote du processus est notifié pour validation.'+(r.categorie==='Piste d\'amélioration'?' Plan d\'action généré.':''); } }};
function declareNC(cat){ const old=FORMS.ncs.def; const ex={'Accident / incident':{categorie:cat,source:'Incident',description:'Chute d\'un magasinier depuis un quai de chargement (entorse, 2 jours d\'arrêt)',typeActe:'Dysfonctionnement',processus:'P07',lieu:'Quai n°3 — entrepôt de Porto-Novo',normes:['45001'],cause:'Quai humide, absence de garde-corps',action:'Installer un garde-corps amovible et un revêtement antidérapant',miseEnOeuvre:'Garde-corps commandé le jour même, balisage provisoire posé',statut:'Déclarée'},'Piste d\'amélioration':{categorie:cat,source:'Boîte à idées',description:'Digitaliser la check-list de prise de poste sur tablette',typeActe:'Dysfonctionnement',processus:'P05',lieu:'Atelier décorticage',normes:['45001','9001'],cause:'Check-lists papier souvent incomplètes',action:'Tester une tablette sur la ligne 1 pendant un mois',statut:'Déclarée'}}[cat]; FORMS.ncs.def=()=>({...old(),...(ex||{})}); openForm('ncs'); FORMS.ncs.def=old; }
function addSource(){ modal({title:'Enrichir la liste des sources',body:`<div id="srcf">${formHTML([{k:'s',l:'Nouvelle source',req:1}],{s:'Inspection de l\'ABE'})}</div><p class="small muted">Sources actuelles : ${DB.sourcesNC.join(', ')}</p>`,foot:`<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="const d=readForm($('#srcf'),[{k:'s',req:1}]);if(d){DB.sourcesNC.push(d.s);logAct('a ajouté la source « '+d.s+' »','Non-conformités');closeModal();toast('Source ajoutée.')}">Ajouter</button>`}); }
function ncAct(id,a){ const n=DB.ncs.find(x=>x.id===id); let m='';
  if(a==='v1'){ n.n1='Validé'; n.statut='Validée pilote'; m='validé(e) par le pilote — transmis(e) au responsable du système'; }
  if(a==='v2'){ n.n2='Approuvé'; n.statut='En traitement'; addRegistre(n.categorie==='Accident / incident'?'Incident':n.categorie,n.description,n.source+' ('+n.ref+')',n.processus,n.normes,procOwner(n.processus)); m='approuvé(e) par le responsable du système — consolidé(e) dans le registre'; }
  if(a==='ko'){ n.statut='Refusée'; n.n1=n.n1==='Validé'?'Validé':'Refusé'; if(n.n1==='Validé') n.n2='Refusé'; m='refusé(e) — retour au déclarant'; }
  if(a==='close'){ const e=prompt('Évaluation de l\'efficacité avant clôture :','Efficace — aucune récidive constatée sur 30 jours'); if(e===null) return; n.statut='Clôturée'; n.efficacite=e; const g=DB.registre.find(x=>x.origine.includes(n.ref)); if(g) g.statut='Clôturé'; m='clôturé(e) — efficacité : '+e; }
  hist(n,n.ref+' '+m); logAct('a '+m.split(' ')[0]+' '+n.ref,'Non-conformités',n.statut); toast(n.ref+' '+m+'.'); render(); ncDetail(id); }
function ncDetail(id){ const n=DB.ncs.find(x=>x.id===id); const idx={Déclarée:1,'Validée pilote':2,'En traitement':3,Clôturée:5,Refusée:1}[n.statut];
  const acts=n.statut==='Déclarée'?`<button class="btn danger" onclick="ncAct('${id}','ko')">Refuser</button><button class="btn primary" onclick="ncAct('${id}','v1')">${I(IC.check,15)} Valider (pilote)</button>`:n.statut==='Validée pilote'?`<button class="btn danger" onclick="ncAct('${id}','ko')">Refuser</button><button class="btn primary" onclick="ncAct('${id}','v2')">${I(IC.check,15)} Approuver (responsable du système)</button>`:n.statut==='En traitement'?`<button class="btn primary" onclick="ncAct('${id}','close')">Évaluer l'efficacité et clôturer</button>`:'';
  detail({coll:'ncs',id,title:n.ref+' · '+n.categorie,sub:'Déclarée le '+fd(n.date)+' par '+n.declarant,rows:[['Circuit',wfHTML(['Déclaration','Validation pilote','Approbation RSM','Traitement','Clôture'],idx,n.statut==='Refusée')],['Statut',sb(n.statut)],['Validation niveau 1 (pilote)',sb(n.n1)],['Validation niveau 2 (responsable)',sb(n.n2)],['Source',esc(n.source)+' — '+esc(n.origine)],['Description',esc(n.description)],['Type d\'acte',esc(n.typeActe)],['Cause',esc(n.cause)],[n.categorie==='Accident / incident'?'Acte / décision':'Plan d\'action',esc(n.action)],...(n.miseEnOeuvre?[['Mise en œuvre',esc(n.miseEnOeuvre)]]:[]),['Lieu',esc(n.lieu)],['Processus',esc(procName(n.processus))],['Normes',nb(n.normes)],...(n.efficacite?[['Efficacité',esc(n.efficacite)]]:[])],edit:['Déclarée','Refusée'].includes(n.statut),acts}); }
PAGES['m6-nc']={t:'6.4 Non-conformités et actions correctives',r:()=>{ const [t,tb]=tabs('nc',[['all','Tous les éléments'],...NC_CAT.map(c=>[c,c])]); const rows=t==='all'?DB.ncs:DB.ncs.filter(n=>n.categorie===t); const N=DB.ncs.filter(inNorm);
  return head(MOD_FULL.m6,'6.4 Non-conformités et actions correctives','Déclarations depuis plusieurs sources, qualification du type d\'acte et validation à deux niveaux : pilote puis responsable du système.',`<button class="btn" onclick="declareNC('Accident / incident')">Déclarer un accident / incident</button><button class="btn" onclick="declareNC('Piste d\\'amélioration')">Créer une piste d'amélioration</button><button class="btn primary" onclick="openForm('ncs')">${I(IC.plus,15)} Déclarer une non-conformité</button>`)+
  `<div class="grid g4 mb">${[['À valider (pilote)',N.filter(n=>n.statut==='Déclarée').length,'amber'],['À approuver (responsable)',N.filter(n=>n.statut==='Validée pilote').length,'amber'],['En traitement',N.filter(n=>n.statut==='En traitement').length,'blue'],['Clôturées',N.filter(n=>n.statut==='Clôturée').length,'green']].map(([a,b])=>`<div class="card"><div class="small muted">${a}</div><div style="font-size:24px;font-weight:700">${b}</div></div>`).join('')}</div>`+tb+
  `<div class="card">${table({id:'ncs',cols:[{l:'Référence',r:n=>`<span class="ttl">${n.ref}</span><br><span class="ref">${fd(n.date)}</span>`},{l:'Catégorie',k:'categorie'},{l:'Description',r:n=>`${esc(n.description)}<br><span class="ref">${esc(n.lieu)}</span>`},{l:'Source',k:'source'},{l:'Type d\'acte',k:'typeActe'},{l:'Processus',r:n=>`<span class="badge b-grey">${n.processus}</span>`},{l:'Statut',r:n=>sb(n.statut)},{l:'Normes',r:n=>nb(n.normes)}],rows,click:'ncDetail',search:['ref','description','lieu'],filters:[{k:'source',l:'Source',o:()=>DB.sourcesNC},{k:'statut',l:'Statut',o:['Déclarée','Validée pilote','En traitement','Clôturée','Refusée']},{k:'processus',l:'Processus',o:procOpts}],exportName:'Non_conformites',extra:`<button class="btn sm" onclick="addSource()">${I(IC.plus,14)} Source</button>`})}</div>`; }};

/* ===================== 6.5 Registre d'amélioration continue ===================== */
const REG_T=['Non-conformité','Incident','Piste d\'amélioration','Observation','Action d\'audit','Action de revue','Action corrective','Risque réalisé'];
PAGES['m6-registre']={t:'6.5 Registre d\'amélioration continue',r:()=>{ const R=DB.registre.filter(inNorm);
  return head(MOD_FULL.m6,'6.5 Registre d\'amélioration continue','Base unique consolidant automatiquement non-conformités, incidents, pistes d\'amélioration et actions issues des audits, revues et risques réalisés.')+
  `<div class="grid g4 mb">${[['Entrées au registre',R.length],['En cours',R.filter(r=>r.statut!=='Clôturé').length],['Clôturées',R.filter(r=>r.statut==='Clôturé').length],['Taux de clôture',Math.round(R.filter(r=>r.statut==='Clôturé').length/Math.max(1,R.length)*100)+' %']].map(([a,b])=>`<div class="card"><div class="small muted">${a}</div><div style="font-size:24px;font-weight:700">${b}</div></div>`).join('')}</div>
  <div class="card">${table({id:'reg',cols:[{l:'Référence',r:g=>`<span class="ttl">${g.ref}</span>`},{l:'Type',r:g=>`<span class="badge b-grey">${esc(g.type)}</span>`},{l:'Intitulé',k:'intitule'},{l:'Origine',k:'origine'},{l:'Processus',r:g=>esc(procShort(g.processus))},{l:'Responsable',k:'responsable'},{l:'Date',r:g=>fd(g.date)},{l:'Statut',r:g=>sb(g.statut)},{l:'Normes',r:g=>nb(g.normes)}],rows:DB.registre,click:'regDetail',search:['ref','intitule','origine','responsable'],filters:[{k:'type',l:'Type',o:REG_T},{k:'statut',l:'Statut',o:['En cours','Clôturé']},{k:'processus',l:'Processus',o:procOpts},{k:'periode',l:'Période',o:[['2026-0','1er semestre 2026'],['2026-S2','2e semestre 2026']],fn:(g,v)=>v==='2026-0'?g.date<'2026-07-01':g.date>='2026-07-01'}],exportName:'Registre_amelioration_continue'})}</div>`; }};
function regDetail(id){ const g=DB.registre.find(x=>x.id===id); drawer({title:g.ref+' · '+g.type,sub:g.origine,body:`<dl class="kv"><dt>Intitulé</dt><dd>${esc(g.intitule)}</dd><dt>Processus</dt><dd>${esc(procName(g.processus))}</dd><dt>Responsable</dt><dd>${esc(g.responsable)}</dd><dt>Date</dt><dd>${fd(g.date)}</dd><dt>Statut</dt><dd>${sb(g.statut)}</dd><dt>Normes</dt><dd>${nb(g.normes)}</dd></dl><div class="note" style="margin-top:14px">Entrée consolidée automatiquement depuis : ${esc(g.origine)}.</div>`,foot:g.statut!=='Clôturé'?`<button class="btn" onclick="logAct('a relancé ${esc(g.responsable)} sur ${g.ref}','Registre','Relance');toast('Relance envoyée à ${esc(g.responsable)}.')">Relancer le responsable</button><button class="btn primary" onclick="const g=DB.registre.find(x=>x.id==='${id}');g.statut='Clôturé';logAct('a clôturé '+g.ref,'Registre');closeModal('drawer');toast('Entrée clôturée et archivée.');render()">Clôturer</button>`:''}); }

function fmDetail(i){ const f=DB.fichesMaitrise.find(x=>x.id===i); detail({coll:'fichesMaitrise',id:i,title:f.objet,sub:procName(f.processus),rows:[['Critères opérationnels',esc(f.criteres)],['Moyens de maîtrise',esc(f.moyens)],['Responsable',esc(f.responsable)],['Ressources',esc(f.ressources)],['Risques liés',f.risques.map(r=>esc(r+' · '+((DB.risques.find(x=>x.id===r)||{}).intitule||''))).join('<br>')],['Dernière mise à jour',fd(f.derniereMaj)],['Prochaine mise à jour',dueBadge(f.prochaineMaj)]],obs:true,acts:`<button class="btn" onclick="fmUpdate('${i}')">Marquer comme mise à jour</button>`}); }

render();
</script></body></html>
