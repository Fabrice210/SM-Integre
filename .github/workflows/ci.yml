name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Lancer aussi le test de bout en bout (backend + Vite + scripts/api-smoke.mjs)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django, PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sm_integre
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm -d sm_integre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sm:sm@localhost:5432/sm_integre
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Migrations up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (pytest on PostgreSQL)
        run: pytest --create-db
      - name: OpenAPI schema (no warnings, valid)
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
      - name: Deployment checks (check --deploy)
        env:
          DEBUG: "false"
          SECRET_KEY: ci-deploy-check-fake-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: sm.example.org
          CSRF_TRUSTED_ORIGINS: https://sm.example.org
        run: python manage.py check --deploy --fail-level WARNING

  e2e:
    name: End-to-end (API + Vite + api-smoke)
    # Manuel : Actions > CI > Run workflow, case « e2e » cochée.
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      SECRET_KEY: ci-e2e-fake-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      CORS_ALLOWED_ORIGINS: http://localhost:5174
      DEMO_PASSWORD: Demo-SM-2026!
      VITE_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py load_demo
      - name: Install frontend and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start API and Vite
        run: |
          (cd backend && python manage.py runserver 8000 > ../backend.log 2>&1 &)
          (npm run dev -- --strictPort > vite.log 2>&1 &)
          for i in $(seq 60); do
            curl -fsS http://localhost:8000/api/v1/ready/ > /dev/null \
              && curl -fsS http://localhost:5174/ > /dev/null && exit 0
            sleep 2
          done
          echo "Servers did not start"; cat backend.log vite.log; exit 1
      - name: API smoke test
        run: node scripts/api-smoke.mjs http://localhost:5174
      - name: Server logs
        if: always()
        run: cat backend.log vite.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React, Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
